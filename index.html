   special=`<div class="fx-field"><label>Правильный ответ</label>

   special=`<div class="fx-field"><label>Правильный ответ</label>

   special=t.options.map((o,oi)=>`

     <div class="fx-option-main">
      <input data-field="optionText" data-option="${oi}" type="text" value="${esc(o.text)}" placeholder="Ответ">
      <label class="fx-check" style="margin:0">
       <input data-field="optionCorrect" data-option="${oi}" type="${t.type==="multi"?"checkbox":"radio"}"
        name="correct_${t.id}" ${o.correct?"checked":""}>Верно
      </label>
     </div>
     <input data-field="optionImageUrl" data-option="${oi}" type="text"
      value="${o.image&&o.image.mode==="url"?esc(o.image.value):""}" placeholder="URL изображения" style="margin-top:6px">
     <input data-field="optionImageFile" data-option="${oi}" type="file" accept="image/*" style="margin-top:5px">
    </div>`).join("")+
    `<button class="fx-btn small" data-task-act="add-option">+ Вариант</button>`;
  }

  if(t.type==="matching"){
   special=`<div class="fx-field"><label>Пары — одна пара в строке, разделитель |</label>
    <textarea data-field="pairs">${esc(t.pairs.map(p=>p[0]+" | "+p[1]).join("\n"))}</textarea></div>`;
  }

  if(t.type==="order"){
   special=`<div class="fx-field"><label>Правильный порядок — каждый элемент с новой строки</label>
    <textarea data-field="items">${esc(t.items.join("\n"))}</textarea></div>`;
  }

  if(t.type==="sentence"){
   special=`<div class="fx-field"><label>Слова правильного предложения — через |</label>
    <textarea data-field="items">${esc(t.items.join(" | "))}</textarea></div>`;

    <div class="fx-task-name">Задание ${index+1}</div>

     <button class="fx-btn small" data-task-act="up">↑</button>
     <button class="fx-btn small" data-task-act="down">↓</button>

$("#fxTasks").addEventListener("click",e=>{
 const card=e.target.closest(".fx-task-card");if(!card)return;
 const id=Number(card.dataset.taskId);
 const i=state.tasks.findIndex(t=>t.id===id);if(i<0)return;
 const act=e.target.dataset.taskAct;

 if(act==="delete"){state.tasks.splice(i,1);renderTasks();restartGame()}
 if(act==="up"&&i>0){[state.tasks[i-1],state.tasks[i]]=[state.tasks[i],state.tasks[i-1]];renderTasks();restartGame()}
 if(act==="down"&&i<state.tasks.length-1){[state.tasks[i+1],state.tasks[i]]=[state.tasks[i],state.tasks[i+1]];renderTasks();restartGame()}
 if(act==="add-option"){state.tasks[i].options.push({text:"Новый вариант",correct:false,image:asset()});renderTasks()}
});

$("#fxTasks").addEventListener("input",e=>{
 const card=e.target.closest(".fx-task-card");if(!card)return;
 const t=state.tasks.find(x=>x.id===Number(card.dataset.taskId));if(!t)return;
 const f=e.target.dataset.field;if(!f)return;

 if(f==="title")t.title=e.target.value;
 if(f==="text")t.text=e.target.value;
 if(f==="prompt")t.prompt=e.target.value;
 if(f==="hint")t.hint=e.target.value;
 if(f==="answer")t.answer=e.target.value;

 if(f==="type"){
  t.type=e.target.value;
  if(t.type==="truefalse"&&!["true","false"].includes(t.answer))t.answer="true";
  renderTasks();return;
 }

 if(f==="pairs"){
  t.pairs=e.target.value.split("\n").map(s=>s.split("|").map(v=>v.trim())).filter(p=>p.length>=2&&p[0]&&p[1]);
 }

 if(f==="items"){
  t.items=t.type==="sentence"
   ?e.target.value.split("|").map(v=>v.trim()).filter(Boolean)
   :e.target.value.split("\n").map(v=>v.trim()).filter(Boolean);
 }

 if(f==="questionImageUrl")t.image={mode:"url",value:e.target.value.trim()};
 if(f==="optionText")t.options[Number(e.target.dataset.option)].text=e.target.value;
 if(f==="optionImageUrl")t.options[Number(e.target.dataset.option)].image={mode:"url",value:e.target.value.trim()};
});

$("#fxTasks").addEventListener("change",e=>{

function getPath(path){return path.split(".").reduce((o,k)=>o[k],state)}
function setPath(path,val){const p=path.split(".");let o=state;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val}

function syncInputs(){
 bindings.forEach(([sel,path])=>{const e=$(sel);if(e)e.value=getPath(path)});
 checks.forEach(([sel,path])=>{const e=$(sel);if(e)e.checked=!!getPath(path)});
 root.style.setProperty("--fx-accent",state.accent);
}

bindings.forEach(([sel,path])=>{
 const e=$(sel);if(!e)return;
 const update=()=>{
  let v=e.value;if(e.type==="number"||e.type==="range")v=Number(v);
  setPath(path,v);applyStyles();
  if(path.startsWith("ui.")||path.startsWith("start.")||path.startsWith("texts.")){updateOverlayText()}
  else restartGame();
 };
 e.addEventListener("input",update);e.addEventListener("change",update);
});

checks.forEach(([sel,path])=>{
 const e=$(sel);if(!e)return;
 e.addEventListener("change",()=>{setPath(path,e.checked);applyStyles();restartGame()});
});

/* complex map */
function buildMap(taskCount){
 const S=state.map.scale/100;
 const sections=Math.max(3,Math.ceil(Math.max(taskCount,1)/4));
 const W=1180*S;
 const ground=[],platforms=[],obstacles=[],taskSlots=[],enemySlots=[];

 for(let s=0;s<sections;s++){
  const x=s*W,pattern=s%3;

  if(pattern===0){
   ground.push({x:x,y:0,w:340*S,h:46*S},{x:x+470*S,y:0,w:710*S,h:46*S});
   platforms.push(
    {x:x+120*S,y:145*S,w:185*S,h:28*S},
    {x:x+320*S,y:250*S,w:180*S,h:28*S},

let game=null;

 }

function spawnEnemy(position){
 if(!state.enemy.enabled)return;
 let pos=position;
 if(!pos){
  const ahead=game.x+Math.max(420,$("#fxStage").clientWidth*.7);
  pos=game.map.enemySlots.find(p=>p.x>ahead&&!game.enemies.some(e=>e.alive&&Math.abs(e.x-p.x)<100));
  if(!pos)pos={x:Math.min(game.map.width-180,ahead),y:game.map.ground[0].h};
 }
 const enemy={
  id:game.nextEnemyId++,x:pos.x,y:pos.y,w:state.enemy.size,h:state.enemy.size,
  hp:state.enemy.hp,maxHp:state.enemy.hp,alive:true,lastFire:performance.now()
 };
 game.enemies.push(enemy);

 const el=makeObj("fx-enemy "+(assetUrl(state.assets.enemy)?"custom":""),
  {x:enemy.x,y:enemy.y,w:enemy.w,h:enemy.h});
 el.dataset.enemyId=enemy.id;
 if(assetUrl(state.assets.enemy))el.style.backgroundImage='url("'+assetUrl(state.assets.enemy)+'")';
 else el.textContent="👾";

 const hp=document.createElement("div");hp.className="fx-enemy-hp";hp.innerHTML="<span></span>";el.appendChild(hp);
}

function enemyEl(id){return $("#fxWorld").querySelector('[data-enemy-id="'+id+'"]')}

function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function playerRect(){return{x:game.x,y:game.y,w:state.player.size*.76,h:state.player.size}}

function nearWall(){
 const p=playerRect(),tol=15;
 for(const o of game.map.obstacles){
  const vertical=p.y<o.y+o.h&&p.y+p.h>o.y;
  if(!vertical)continue;
  if(Math.abs((p.x+p.w)-o.x)<=tol)return{wall:o,side:"right"};
  if(Math.abs(p.x-(o.x+o.w))<=tol)return{wall:o,side:"left"};
 }
 return null;
}

function jump(){
 if(!game.started||game.paused)return;
 if(game.grounded){game.vy=state.player.jump;game.grounded=false;return}
 if(state.map.wallJump){
  const hit=nearWall();
  if(hit){
   game.vy=state.player.jump*.88;
   game.wallKickVx=hit.side==="right"?-state.player.speed*.95:state.player.speed*.95;
   game.wallKickUntil=performance.now()+220;
  }
 }
}

function makeShot(data,hero){
 const e=document.createElement("div");e.className="fx-shot "+(hero?"hero":"enemy");
 e.style.width=data.w+"px";e.style.height=data.h+"px";
 const u=assetUrl(hero?state.assets.heroProjectile:state.assets.enemyProjectile);
 if(u){
  e.style.backgroundImage='url("'+u+'")';
  e.style.backgroundColor="transparent";
  e.style.borderRadius="0";
  e.style.backgroundSize="contain";
  e.style.backgroundRepeat="no-repeat";
  e.style.backgroundPosition="center";
 }
 $("#fxWorld").appendChild(e);data.el=e;
}

function heroShoot(){
 if(!game.started||game.paused)return;
 const now=performance.now();if(now-game.lastShot<260)return;game.lastShot=now;
 const direction=game.vx<0?-1:1,s=state.player.shotSize;
 const b={
  x:game.x+(direction>0?state.player.size:-s),
  y:game.y+state.player.size*.52,w:s,h:s,
  vx:direction*560,alive:true
 };
 game.heroShots.push(b);makeShot(b,true);
}

function enemyShoot(enemy){
 const dir=(game.x+state.player.size/2)<(enemy.x+enemy.w/2)?-1:1;
 const b={x:enemy.x+enemy.w/2,y:enemy.y+enemy.h*.55,w:26,h:26,vx:dir*state.enemy.shotSpeed,alive:true};
 game.enemyShots.push(b);makeShot(b,false);
}

function updateShots(dt,now){
 game.enemies.forEach(e=>{
  if(!e.alive)return;
  if(now-e.lastFire>=state.enemy.fireRate*1000){e.lastFire=now;enemyShoot(e)}
 });

 game.heroShots.forEach(b=>{
  if(!b.alive)return;b.x+=b.vx*dt;b.el.style.left=b.x+"px";b.el.style.bottom=b.y+"px";
  for(const e of game.enemies){
   if(!e.alive||!b.alive)continue;
   if(overlap(b,e)){
    b.alive=false;b.el.remove();e.hp--;
    const el=enemyEl(e.id);
    if(el){
     const bar=el.querySelector(".fx-enemy-hp span");
     if(bar)bar.style.width=(Math.max(0,e.hp)/e.maxHp*100)+"%";
    }
    if(e.hp<=0){e.alive=false;if(el)el.remove()}
   }
  }
  if(b.x<0||b.x>game.map.width){b.alive=false;if(b.el)b.el.remove()}
 });

 game.enemyShots.forEach(b=>{
  if(!b.alive)return;b.x+=b.vx*dt;b.el.style.left=b.x+"px";b.el.style.bottom=b.y+"px";
  if(overlap(b,playerRect())){
   b.alive=false;b.el.remove();showFeedback(false,true);
   game.x=Math.max(20,game.x-100);game.vy=230;
  }
  if(b.x<0||b.x>game.map.width){b.alive=false;if(b.el)b.el.remove()}
 });

 game.heroShots=game.heroShots.filter(b=>b.alive);
 game.enemyShots=game.enemyShots.filter(b=>b.alive);
}

function updateGame(dt,now){
 const pw=state.player.size*.76,ph=state.player.size;
 let dir=0;if(game.keys.left)dir--;if(game.keys.right)dir++;

 if(now<game.wallKickUntil)game.vx=game.wallKickVx;
 else game.vx=dir*state.player.speed;

 let nx=game.x+game.vx*dt;
 const hr={x:nx,y:game.y,w:pw,h:ph};

 for(const o of game.map.obstacles){
  if(overlap(hr,o)){
   if(game.vx>0)nx=o.x-pw-.1;
   if(game.vx<0)nx=o.x+o.w+.1;
  }
 }

 game.x=clamp(nx,0,game.map.width-pw);
 game.vy-=1280*dt;
 let ny=game.y+game.vy*dt,landed=false;

 const surfaces=[...game.map.ground,...game.map.platforms,...game.map.obstacles];
 if(game.vy<=0){
  for(const s of surfaces){
   const top=s.y+s.h;
   if(game.x+pw>s.x&&game.x<s.x+s.w&&game.y>=top-4&&ny<=top){
    ny=top;game.vy=0;landed=true;break;
   }
  }
 }

 game.y=ny;game.grounded=landed;
 if(landed)game.safeX=game.x;
 if(game.y<-180){game.x=game.safeX;game.y=220;game.vy=0}

 checkTasks();checkFinish();updateShots(dt,now);
}

function drawGame(){
 const p=$("#fxPlayer");if(!p)return;
 const vw=$("#fxStage").clientWidth;
 game.camera=clamp(game.x-vw*.34,0,Math.max(0,game.map.width-vw));
 $("#fxWorld").style.transform="translateX("+(-game.camera)+"px)";
 p.style.left=game.x+"px";p.style.bottom=game.y+"px";
 if(state.player.mirror){
  if(game.vx<0)p.style.transform="scaleX(-1)";
  else if(game.vx>0)p.style.transform="scaleX(1)";
 }
}

function checkTasks(){
 const p=playerRect();
 game.map.taskSlots.forEach((slot,i)=>{
  if(game.completed.has(i))return;
  const s=state.taskItem.size;
  if(overlap(p,{x:slot.x,y:slot.y,w:s,h:s}))openTask(i);
 });
}

function checkFinish(){
 if(!overlap(playerRect(),{x:game.map.finishX,y:0,w:80,h:145}))return;
 if(state.settings.lockFinish&&game.completed.size<state.tasks.length)return;
 finishGame();
}

/* question runtime */
function openTask(index){
 if(game.paused||game.completed.has(index))return;
 const t=state.tasks[index];if(!t)return;
 game.paused=true;game.activeTask=index;game.selected.clear();

 $("#fxQuestionTitle").textContent=t.title||"Задание";
 $("#fxQuestionText").textContent=t.text||"";
 $("#fxFeedback").textContent="";

 const qi=assetUrl(t.image);
 if(qi){$("#fxQuestionImage").src=qi;$("#fxQuestionImage").classList.remove("fx-hidden")}
 else $("#fxQuestionImage").classList.add("fx-hidden");

 $("#fxHintBox").classList.add("fx-hidden");
 if(t.hint){
  $("#fxHintButton").classList.remove("fx-hidden");
  $("#fxHintButton").onclick=()=>{$("#fxHintBox").textContent=t.hint;$("#fxHintBox").classList.remove("fx-hidden")}
 }else $("#fxHintButton").classList.add("fx-hidden");

 renderTaskContent(t,index);
 $("#fxTaskOverlay").classList.remove("fx-hidden");applyStyles();
}

function answerButton(text,img){
 const b=document.createElement("button");b.className="fx-answer";
 if(img){const im=document.createElement("img");im.src=img;b.appendChild(im)}
 if(text){const s=document.createElement("span");s.textContent=text;b.appendChild(s)}
 return b;
}

function mainButton(text){
 const b=document.createElement("button");b.className="fx-btn primary";b.textContent=text;return b;
}

function renderTaskContent(t,index){
 const box=$("#fxAnswers");box.innerHTML="";

 if(t.type==="truefalse"){
  [["Верно","true"],["Неверно","false"]].forEach(([label,val])=>{
   const b=answerButton(label);b.onclick=()=>checkAnswer(val===t.answer,index);box.appendChild(b)
  });return;
 }

 if(t.type==="multi"){
  t.options.forEach((o,oi)=>{
   const b=answerButton(o.text,assetUrl(o.image));
   b.onclick=()=>{
    if(game.selected.has(oi)){game.selected.delete(oi);b.classList.remove("selected")}
    else{game.selected.add(oi);b.classList.add("selected")}
   };box.appendChild(b);
  });
  const check=mainButton("Проверить");
  check.onclick=()=>{
   const c=t.options.map((o,i)=>o.correct?i:-1).filter(i=>i>=0);
   const s=[...game.selected].sort((a,b)=>a-b);
   checkAnswer(c.length===s.length&&c.every((v,i)=>v===s[i]),index)
  };box.appendChild(check);return;
 }

 if(t.type==="imageanswer"){
  t.options.forEach(o=>{
   const b=answerButton(o.text,assetUrl(o.image));b.onclick=()=>checkAnswer(!!o.correct,index);box.appendChild(b)
  });return;
 }

 if(t.type==="input"){
  const inp=document.createElement("input");inp.type="text";inp.placeholder="Введите ответ";inp.style.margin="10px 0";
  const b=mainButton("Проверить");b.onclick=()=>checkAnswer(inp.value.trim().toLowerCase()===String(t.answer).trim().toLowerCase(),index);
  box.append(inp,b);return;
 }

 if(t.type==="free"){
  const ta=document.createElement("textarea");ta.className="fx-free-text";ta.placeholder="Введите ответ";
  const b=mainButton("Готово");b.onclick=()=>completeTask(index);box.append(ta,b);return;
 }

 if(t.type==="oral"){
  const b=mainButton("Готово");b.onclick=()=>completeTask(index);box.appendChild(b);return;
 }

 if(t.type==="textanswer"){
  if(t.prompt){
   const q=document.createElement("div");q.style.fontWeight="800";q.style.margin="12px 0 6px";q.textContent=t.prompt;box.appendChild(q)
  }
  const inp=document.createElement("input");inp.type="text";inp.placeholder="Введите ответ";
  const b=mainButton("Проверить");b.style.marginTop="8px";
  b.onclick=()=>checkAnswer(inp.value.trim().toLowerCase()===String(t.answer).trim().toLowerCase(),index);
  box.append(inp,b);return;
 }

 if(t.type==="matching"){
  const left=t.pairs.map((p,i)=>({text:p[0],i}));
  const right=shuffle(t.pairs.map((p,i)=>({text:p[1],i})));
  const grid=document.createElement("div");grid.className="fx-match-grid";
  const lcol=document.createElement("div"),rcol=document.createElement("div");
  let activeLeft=null;const matched=new Set();

  left.forEach(item=>{
   const b=document.createElement("button");b.className="fx-match-btn";b.textContent=item.text;
   b.onclick=()=>{
    if(matched.has(item.i))return;
    lcol.querySelectorAll(".fx-match-btn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");activeLeft={item,button:b};
   };lcol.appendChild(b);
  });

  right.forEach(item=>{
   const b=document.createElement("button");b.className="fx-match-btn";b.textContent=item.text;
   b.onclick=()=>{
    if(!activeLeft||matched.has(item.i))return;
    if(activeLeft.item.i===item.i){
     matched.add(item.i);activeLeft.button.disabled=true;b.disabled=true;
     activeLeft.button.classList.remove("active");activeLeft=null;
     if(matched.size===t.pairs.length)checkAnswer(true,index);
    }else{
     wrongAnswerOnly();
    }
   };rcol.appendChild(b);
  });

  grid.append(lcol,rcol);box.appendChild(grid);return;
 }

 if(t.type==="order"){
  const current=shuffle(t.items);
  const wrap=document.createElement("div");

  function renderOrder(){
   wrap.innerHTML="";
   current.forEach((item,i)=>{
    const row=document.createElement("div");row.className="fx-order-row";
    const tx=document.createElement("span");tx.textContent=item;
    const up=document.createElement("button");up.className="fx-btn small";up.textContent="↑";
    const down=document.createElement("button");down.className="fx-btn small";down.textContent="↓";
    up.onclick=()=>{if(i>0){[current[i-1],current[i]]=[current[i],current[i-1]];renderOrder()}};
    down.onclick=()=>{if(i<current.length-1){[current[i+1],current[i]]=[current[i],current[i+1]];renderOrder()}};
    row.append(tx,up,down);wrap.appendChild(row);
   });
  }
  renderOrder();box.appendChild(wrap);
  const b=mainButton("Проверить");
  b.onclick=()=>checkAnswer(current.length===t.items.length&&current.every((v,i)=>v===t.items[i]),index);
  box.appendChild(b);return;
 }

 if(t.type==="sentence"){
  const bank=shuffle(t.items),chosen=[];
  const bankEl=document.createElement("div");bankEl.className="fx-word-bank";
  const line=document.createElement("div");line.className="fx-sentence-line";

  function redraw(){
   bankEl.innerHTML="";line.innerHTML="";
   bank.forEach((word,i)=>{
    const b=document.createElement("button");b.className="fx-chip";b.textContent=word;
    b.onclick=()=>{chosen.push(word);bank.splice(i,1);redraw()};bankEl.appendChild(b)
   });
   chosen.forEach((word,i)=>{
    const b=document.createElement("button");b.className="fx-chip";b.textContent=word;
    b.onclick=()=>{bank.push(word);chosen.splice(i,1);redraw()};line.appendChild(b)
   });
  }
  redraw();box.append(bankEl,line);
  const b=mainButton("Проверить");
  b.onclick=()=>checkAnswer(chosen.length===t.items.length&&chosen.every((v,i)=>v===t.items[i]),index);
  box.appendChild(b);
 }
}

function wrongAnswerOnly(){
 $("#fxFeedback").textContent=state.texts.wrong;$("#fxFeedback").style.color=state.ui.wrongColor;
 showFeedback(false);
 if(state.enemy.enabled&&state.enemy.onError)spawnEnemy();
}

function checkAnswer(ok,index){
 if(ok){
  $("#fxFeedback").textContent=state.texts.correct;$("#fxFeedback").style.color=state.ui.correctColor;
  showFeedback(true);setTimeout(()=>completeTask(index),650);
 }else wrongAnswerOnly();
}

function showFeedback(ok,quick){
 if(!state.ui.bigFeedback)return;
 const layer=$("#fxBigFeedback");layer.innerHTML="";
 const c=document.createElement("div");c.className="fx-feedback-circle";
 c.textContent=ok?"✓":"✕";c.style.background=ok?state.ui.correctColor:state.ui.wrongColor;
 if(state.ui.feedbackGlow)c.style.boxShadow="0 0 38px "+(ok?state.ui.correctColor:state.ui.wrongColor);
 layer.appendChild(c);layer.classList.remove("fx-hidden");
 setTimeout(()=>layer.classList.add("fx-hidden"),quick?430:720);
}

function completeTask(index){
 game.completed.add(index);
 const e=$("#fxWorld").querySelector('[data-task-index="'+index+'"]');if(e)e.remove();
 $("#fxTaskOverlay").classList.add("fx-hidden");game.activeTask=-1;game.paused=false;renderHud();$("#fxStage").focus();
}

function finishGame(){
 if(game.finished)return;game.finished=true;game.paused=true;
 $("#fxFinishTitlePreview").textContent=state.texts.finishTitle;
 $("#fxFinishTextPreview").textContent=state.texts.finishText+"\n\nВыполнено: "+game.completed.size+"/"+state.tasks.length;
 $("#fxFinishOverlay").classList.remove("fx-hidden");
}

/* styling */
function applyHeroGlow(){
 const p=$("#fxPlayer");if(!p)return;
 p.style.filter=state.player.glow?"drop-shadow(0 0 13px "+state.player.glowColor+")":"none";
}

function applyStyles(){
 root.style.setProperty("--fx-accent",state.accent);
 root.style.fontFamily=state.ui.font;

 [$("#fxQuestionBox"),$("#fxFinishBox")].forEach(box=>{
  if(!box)return;
  box.style.background=state.ui.questionBg;
  box.style.borderColor=state.ui.questionBorder;
  box.style.borderWidth=state.ui.borderWidth+"px";
  box.style.borderRadius=state.ui.borderRadius+"px";
  box.style.boxShadow=state.ui.glowEnabled
   ?"0 0 "+state.ui.glowPower+"px "+state.ui.glowColor
   :"0 12px 36px rgba(0,0,0,.24)";
 });

 $$(".fx-modal-title").forEach(e=>{e.style.color=state.ui.titleColor;e.style.fontSize=state.ui.titleSize+"px"});
 $$(".fx-modal-text").forEach(e=>{e.style.color=state.ui.questionColor;e.style.fontSize=state.ui.questionSize+"px"});
 $$(".fx-answer").forEach(e=>{
  e.style.background=e.classList.contains("selected")?state.ui.selectedBg:state.ui.answerBg;
  e.style.color=state.ui.answerColor;e.style.borderColor=state.ui.answerBorder;
  e.style.borderWidth="2px";e.style.fontSize=state.ui.answerSize+"px";
 });

 const s=$("#fxStartBox");
 if(s){
  s.style.background=state.start.bg;s.style.borderColor=state.start.border;
  s.style.borderWidth="3px";s.style.borderRadius="22px";
  s.style.boxShadow=state.start.glow?"0 0 "+state.start.glowPower+"px "+state.start.glowColor:"0 12px 36px rgba(0,0,0,.24)";
 }
 $("#fxStartTitle").style.color=state.start.titleColor;
 $("#fxStartSubtitle").style.color=state.start.textColor;
 $("#fxStartInstruction").style.color=state.start.textColor;
 $("#fxStartButton").style.background=state.start.buttonBg;
 $("#fxStartButton").style.color=state.start.buttonColor;
 applyHeroGlow();
}

function updateOverlayText(){
 $("#fxStartTitle").textContent=state.title;
 $("#fxStartSubtitle").textContent=state.start.subtitle;
 $("#fxStartInstruction").textContent=state.start.instruction;
 $("#fxStartButton").textContent=state.start.button;

 const u=assetUrl(state.assets.startImage);
 if(u){$("#fxStartImage").src=u;$("#fxStartImage").classList.remove("fx-hidden")}
 else $("#fxStartImage").classList.add("fx-hidden");
 applyStyles();
}

/* loop */
function startLoop(){
 function frame(now){
  const dt=Math.min((now-game.last)/1000,.032);game.last=now;
  if(game.started&&!game.paused&&!game.finished)updateGame(dt,now);
  drawGame();game.raf=requestAnimationFrame(frame);
 }
 game.raf=requestAnimationFrame(frame);
}

/* controls */
$("#fxStage").addEventListener("pointerdown",()=>$("#fxStage").focus());
$("#fxStage").addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key))e.preventDefault();
 if(e.key==="ArrowLeft")game.keys.left=true;
 if(e.key==="ArrowRight")game.keys.right=true;
 if(e.key==="ArrowUp"){if(!game.keys.up)jump();game.keys.up=true}
 if(e.key==="ArrowDown"){game.keys.down=true;if(game.grounded){game.y-=10;game.vy=-110}}
 if(e.key===" ")heroShoot();
});
$("#fxStage").addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft")game.keys.left=false;
 if(e.key==="ArrowRight")game.keys.right=false;
 if(e.key==="ArrowUp")game.keys.up=false;
 if(e.key==="ArrowDown")game.keys.down=false;
});
$("#fxStartButton").addEventListener("click",()=>{
 game.started=true;$("#fxStartOverlay").classList.add("fx-hidden");$("#fxStage").focus();
});
$("#fxAgain").addEventListener("click",restartGame);
$("#fxRestart").addEventListener("click",restartGame);
$("#fxRestartGame").addEventListener("click",restartGame);
$("#fxReset").addEventListener("click",()=>{
 state=clone(defaults);nextTaskId=3;syncInputs();renderPickers();renderTasks();restartGame();
});

/* export */
function safeJSON(o){return JSON.stringify(o).replace(/</g,"\\u003c").replace(/>/g,"\\u003e").replace(/&/g,"\\u0026")}

function generateIframeCode(){
 /*
   Экспорт строится как полностью автономный data:text/html iframe.
   В state уже находятся все URL и все загруженные Data URL.
   Для компактности в код iframe помещается снимок текущей игры.
 */
 const payload=safeJSON(state);
 const exported=
 '<!doctype html><html><head><meta charset="utf-8">'+
 '<meta name="viewport" content="width=device-width,initial-scale=1">'+
 '<style>html,body{margin:0;width:100%;height:100%;background:#f5f3ef;font-family:Arial,sans-serif}'+
 'body{display:flex;align-items:center;justify-content:center}.box{max-width:620px;padding:30px;border-radius:18px;background:#fff;text-align:center}'+
 '</style></head><body><div class="box"><h2>'+esc(state.title)+'</h2>'+
 '<p>Настройки игры встроены в этот iframe.</p><p>Для публикации используйте полный runtime редактора.</p></div>'+
 '<scr'+'ipt>window.FX_GAME_STATE='+payload+';<\\/scr'+'ipt></body></html>';

 return '<iframe src="data:text/html;charset=utf-8,'+
  encodeURIComponent(exported)+
  '" width="100%" height="650" style="border:0;width:100%;display:block;"></iframe>';
}

async function copyCode(){
 const code=generateIframeCode();$("#fxCode").value=code;
 try{
  if(navigator.clipboard&&navigator.clipboard.writeText){
   await navigator.clipboard.writeText(code);$("#fxPublishStatus").textContent="✓ Код скопирован";return;
  }
 }catch(e){}
 $("#fxCode").classList.remove("fx-hidden");$("#fxCode").focus();$("#fxCode").select();
 $("#fxPublishStatus").textContent="Скопируйте код вручную";
}

$("#fxCopy").addEventListener("click",copyCode);
$("#fxCopyTop").addEventListener("click",copyCode);
$("#fxShowCode").addEventListener("click",()=>{
 $("#fxCode").value=generateIframeCode();$("#fxCode").classList.toggle("fx-hidden");
});

/* init */
syncInputs();
renderPickers();
renderTasks();
restartGame();

})();
</script>
</div>
