<div id="FX_ROOT">
<style>
#FX_ROOT{
  --accent:#6f8063;
  --accent-soft:#edf2e9;
  --page:#f4f2ed;
  --panel:#ffffff;
  --line:#ddd9d0;
  --text:#292929;
  --muted:#7a7a7a;
  font-family:Arial,sans-serif;
  width:100%;
  color:var(--text);
}
#FX_ROOT *{box-sizing:border-box}
#FX_ROOT button,
#FX_ROOT input,
#FX_ROOT select,
#FX_ROOT textarea{font:inherit}
#FX_ROOT button{cursor:pointer}

#FX_ROOT .fx-shell{
  background:var(--page);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
}

#FX_ROOT .fx-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
  padding:14px 18px;
  background:#fff;
  border-bottom:1px solid var(--line);
}
#FX_ROOT .fx-title{
  font-size:20px;
  font-weight:800;
}
#FX_ROOT .fx-top-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

#FX_ROOT .fx-tabs{
  display:flex;
  gap:5px;
  padding:9px;
  overflow:auto;
  background:#fff;
  border-bottom:1px solid var(--line);
}
#FX_ROOT .fx-tab{
  border:0;
  border-radius:9px;
  padding:9px 12px;
  background:#eceae4;
  color:#555;
  font-weight:700;
  white-space:nowrap;
}
#FX_ROOT .fx-tab.active{
  background:var(--accent);
  color:#fff;
}

#FX_ROOT .fx-main{
  display:grid;
  grid-template-columns:minmax(330px,430px) minmax(0,1fr);
  gap:14px;
  padding:14px;
  align-items:start;
}
#FX_ROOT .fx-controls{min-width:0}
#FX_ROOT .fx-pane{display:none}
#FX_ROOT .fx-pane.active{display:block}

#FX_ROOT .fx-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
  margin-bottom:11px;
}
#FX_ROOT .fx-card-title{
  font-weight:800;
  margin-bottom:10px;
}
#FX_ROOT .fx-subtitle{
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
  margin-top:-4px;
  margin-bottom:10px;
}

#FX_ROOT .fx-field{margin-bottom:10px}
#FX_ROOT label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:5px;
}
#FX_ROOT input[type=text],
#FX_ROOT input[type=number],
#FX_ROOT select,
#FX_ROOT textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:9px;
  padding:9px 10px;
  background:#fff;
  color:#222;
}
#FX_ROOT textarea{
  min-height:76px;
  resize:vertical;
}
#FX_ROOT input[type=color]{
  width:100%;
  height:39px;
  padding:3px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:9px;
}
#FX_ROOT input[type=range]{width:100%}
#FX_ROOT input[type=file]{width:100%;font-size:12px}

#FX_ROOT .fx-grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
#FX_ROOT .fx-grid3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}
#FX_ROOT .fx-check{
  display:flex;
  align-items:center;
  gap:8px;
  margin:8px 0;
  font-size:13px;
}
#FX_ROOT .fx-check input{margin:0}

#FX_ROOT .fx-btn{
  border:0;
  border-radius:9px;
  padding:9px 12px;
  background:#e8e6e0;
  color:#333;
  font-weight:700;
}
#FX_ROOT .fx-btn.primary{
  background:var(--accent);
  color:#fff;
}
#FX_ROOT .fx-btn.danger{
  background:#f4dddd;
  color:#8a3232;
}
#FX_ROOT .fx-btn.small{
  padding:6px 8px;
  font-size:12px;
}
#FX_ROOT .fx-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

#FX_ROOT .fx-image-card{
  border:1px dashed #cbc6bb;
  border-radius:11px;
  padding:9px;
  background:#faf9f6;
}
#FX_ROOT .fx-source-tabs{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-bottom:8px;
}
#FX_ROOT .fx-source-btn{
  border:0;
  border-radius:8px;
  padding:6px 9px;
  font-size:12px;
  background:#eceae4;
}
#FX_ROOT .fx-source-btn.active{
  background:var(--accent-soft);
  color:#46563e;
  font-weight:800;
}
#FX_ROOT .fx-thumb{
  display:none;
  width:92px;
  height:65px;
  margin-top:8px;
  object-fit:contain;
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
}
#FX_ROOT .fx-thumb.show{display:block}

#FX_ROOT .fx-type-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
  margin-bottom:12px;
}
#FX_ROOT .fx-type-btn{
  min-height:58px;
  border:1px solid var(--line);
  border-radius:11px;
  padding:8px;
  background:#fff;
  text-align:left;
  font-weight:700;
  line-height:1.25;
}
#FX_ROOT .fx-type-btn.active{
  border-color:var(--accent);
  background:var(--accent-soft);
  box-shadow:0 0 0 2px rgba(111,128,99,.12);
}
#FX_ROOT .fx-type-btn span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
  font-weight:400;
}

#FX_ROOT .fx-task-card{
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  background:#faf9f6;
  margin-bottom:9px;
}
#FX_ROOT .fx-task-head{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
  margin-bottom:9px;
}
#FX_ROOT .fx-task-num{font-weight:800}
#FX_ROOT .fx-task-actions{
  display:flex;
  gap:4px;
}
#FX_ROOT .fx-option{
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  padding:8px;
  margin-bottom:6px;
}
#FX_ROOT .fx-option-top{
  display:grid;
  grid-template-columns:1fr auto;
  gap:7px;
  align-items:center;
}
#FX_ROOT .fx-answer-source{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:6px;
}

#FX_ROOT .fx-preview-wrap{
  position:sticky;
  top:10px;
  min-width:0;
}
#FX_ROOT .fx-preview-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
  flex-wrap:wrap;
}
#FX_ROOT .fx-preview-note{
  font-size:12px;
  color:var(--muted);
}
#FX_ROOT .fx-stage{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  min-height:440px;
  overflow:hidden;
  outline:none;
  border:1px solid var(--line);
  border-radius:17px;
  background:#cfe8f5;
  user-select:none;
}
#FX_ROOT .fx-stage:focus{
  box-shadow:0 0 0 3px rgba(111,128,99,.2);
}

#FX_ROOT .fx-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
}
#FX_ROOT .fx-world{
  position:absolute;
  left:0;
  bottom:0;
  height:100%;
  will-change:transform;
}
#FX_ROOT .fx-obj{position:absolute}

#FX_ROOT .fx-ground{
  background:#71965e;
  border-top:6px solid rgba(255,255,255,.28);
}
#FX_ROOT .fx-platform{
  background:#b27d55;
  border-top:6px solid #71965e;
  border-radius:9px 9px 4px 4px;
}
#FX_ROOT .fx-obstacle{
  background:#a66f50;
  border-radius:9px;
  border:3px solid rgba(0,0,0,.08);
}
#FX_ROOT .fx-player{
  z-index:30;
  background:#e67866;
  border:4px solid white;
  border-radius:16px;
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center bottom;
  transform-origin:center center;
}
#FX_ROOT .fx-player.image{
  border:0;
  background-color:transparent;
}
#FX_ROOT .fx-task-item,
#FX_ROOT .fx-bonus-item{
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
}
#FX_ROOT .fx-task-item{
  animation:fxFloat 1.5s ease-in-out infinite;
}
#FX_ROOT .fx-bonus-item{
  animation:fxPulse 1.4s ease-in-out infinite;
}
#FX_ROOT .fx-finish{
  z-index:20;
  width:75px;
  height:125px;
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center bottom;
}
#FX_ROOT .fx-finish.flag:before{
  content:"";
  position:absolute;
  left:12px;
  top:0;
  width:7px;
  height:125px;
  background:#f7f7f7;
}
#FX_ROOT .fx-finish.flag:after{
  content:"";
  position:absolute;
  top:8px;
  left:19px;
  width:52px;
  height:36px;
  background:#e56061;
  clip-path:polygon(0 0,100% 50%,0 100%);
}

#FX_ROOT .fx-hud{
  position:absolute;
  z-index:60;
  top:11px;
  left:11px;
  display:flex;
  gap:7px;
}
#FX_ROOT .fx-pill{
  padding:7px 11px;
  border-radius:999px;
  background:rgba(255,255,255,.91);
  font-size:13px;
  font-weight:800;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}

#FX_ROOT .fx-overlay{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
  background:rgba(20,20,20,.46);
}
#FX_ROOT .fx-hidden{display:none!important}

#FX_ROOT .fx-game-card{
  width:min(var(--question-width,560px),96%);
  max-height:92%;
  overflow:auto;
  padding:var(--question-padding,22px);
  border-style:solid;
  border-width:var(--question-border-width,3px);
  border-color:var(--question-border,#7c8c70);
  border-radius:var(--question-radius,20px);
  background:var(--question-bg,#ffffff);
  color:var(--question-text,#222222);
  box-shadow:var(--question-shadow,0 12px 35px rgba(0,0,0,.2));
  font-family:var(--question-font,Arial,sans-serif);
}
#FX_ROOT .fx-game-card h2{
  margin:0 0 10px;
  font-size:var(--question-size,25px);
  color:var(--question-title,#222222);
  line-height:1.2;
}
#FX_ROOT .fx-game-card p{
  margin:8px 0;
  white-space:pre-wrap;
  font-size:var(--question-size,25px);
  line-height:1.4;
}
#FX_ROOT .fx-question-image{
  display:block;
  max-width:100%;
  max-height:210px;
  object-fit:contain;
  margin:8px auto 12px;
  border-radius:12px;
}

#FX_ROOT .fx-answer-btn{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  margin:7px 0;
  padding:var(--answer-padding,12px);
  border-style:solid;
  border-width:var(--answer-border-width,2px);
  border-color:var(--answer-border,#ddd);
  border-radius:var(--answer-radius,12px);
  background:var(--answer-bg,#f7f7f7);
  color:var(--answer-text,#222);
  font-family:var(--answer-font,Arial,sans-serif);
  font-size:var(--answer-size,18px);
  text-align:left;
  transition:.15s;
}
#FX_ROOT .fx-answer-btn:hover{
  filter:brightness(.98);
}
#FX_ROOT .fx-answer-btn.selected{
  outline:3px solid var(--accent);
  background:var(--accent-soft);
}
#FX_ROOT .fx-answer-btn img{
  width:90px;
  height:72px;
  object-fit:contain;
  border-radius:9px;
}

#FX_ROOT .fx-text-answer{
  width:100%;
  border:2px solid var(--answer-border,#ddd);
  border-radius:12px;
  padding:12px;
  font-size:var(--answer-size,18px);
  margin:8px 0;
}

#FX_ROOT .fx-hint-box{
  background:#fff6d7;
  border:1px solid #ead58d;
  border-radius:11px;
  padding:10px;
  margin:9px 0;
  font-size:14px;
}
#FX_ROOT .fx-feedback{
  min-height:24px;
  margin-top:10px;
  font-weight:800;
  text-align:center;
}

#FX_ROOT .fx-correct-flash{
  animation:fxCorrect .55s ease;
}
#FX_ROOT .fx-wrong-shake{
  animation:fxWrong .45s ease;
}

#FX_ROOT .fx-feedback-badge{
  position:absolute;
  z-index:150;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  min-width:170px;
  padding:18px 22px;
  border-radius:20px;
  text-align:center;
  font-size:25px;
  font-weight:900;
  box-shadow:0 12px 35px rgba(0,0,0,.2);
}
#FX_ROOT .fx-feedback-badge.correct{
  background:#def2dc;
  color:#33713b;
  border:3px solid #7db784;
}
#FX_ROOT .fx-feedback-badge.wrong{
  background:#fae2e2;
  color:#a23c3c;
  border:3px solid #df8585;
}

#FX_ROOT .fx-toast{
  position:absolute;
  z-index:160;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  background:rgba(25,25,25,.9);
  color:#fff;
  border-radius:999px;
  padding:9px 14px;
  font-size:13px;
}

#FX_ROOT .fx-code{
  width:100%;
  min-height:190px;
  font-family:monospace;
  font-size:11px;
}
#FX_ROOT .fx-status{
  margin-top:7px;
  color:var(--muted);
  font-size:12px;
}

@keyframes fxFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}
@keyframes fxPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.14)}
}
@keyframes fxCorrect{
  0%{transform:scale(.96)}
  55%{transform:scale(1.03)}
  100%{transform:scale(1)}
}
@keyframes fxWrong{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px)}
  40%{transform:translateX(9px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(6px)}
}

@media(max-width:980px){
  #FX_ROOT .fx-main{grid-template-columns:1fr}
  #FX_ROOT .fx-preview-wrap{position:static}
}
@media(max-width:520px){
  #FX_ROOT .fx-grid2,
  #FX_ROOT .fx-grid3,
  #FX_ROOT .fx-type-grid{
    grid-template-columns:1fr;
  }
  #FX_ROOT .fx-stage{min-height:300px}
}
</style>

<div class="fx-shell">

  <div class="fx-top">
    <div class="fx-title">🎮 Конструктор платформенной игры</div>

    <div class="fx-top-actions">
      <button id="fxResetBtn" class="fx-btn">Сбросить</button>
      <button id="fxRestartBtn" class="fx-btn primary">▶ Тест-драйв</button>
      <button id="fxQuickCopyBtn" class="fx-btn primary">📋 Копировать код</button>
    </div>
  </div>

  <div class="fx-tabs" id="fxTabs">
    <button class="fx-tab active" data-tab="design">🎨 Оформление</button>
    <button class="fx-tab" data-tab="hero">👤 Герой</button>
    <button class="fx-tab" data-tab="questionStyle">🖌 Окно задания</button>
    <button class="fx-tab" data-tab="tasks">❓ Задания</button>
    <button class="fx-tab" data-tab="items">🎁 Предметы</button>
    <button class="fx-tab" data-tab="settings">⚙️ Настройки</button>
    <button class="fx-tab" data-tab="publish">📤 Публикация</button>
  </div>

  <div class="fx-main">

    <div class="fx-controls">

      <div class="fx-pane active" data-pane="design">

        <div class="fx-card">
          <div class="fx-card-title">Основное оформление</div>

          <div class="fx-field">
            <label>Название игры</label>
            <input id="fxTitle" type="text">
          </div>

          <div class="fx-grid2">
            <div class="fx-field">
              <label>Основной цвет интерфейса</label>
              <input id="fxAccent" type="color">
            </div>

            <div class="fx-field">
              <label>Цвет неба / подложки</label>
              <input id="fxSky" type="color">
            </div>
          </div>
        </div>

        <div id="picker_background"></div>
        <div id="picker_ground"></div>
        <div id="picker_platform"></div>
        <div id="picker_obstacle"></div>
        <div id="picker_startImage"></div>

      </div>

      <div class="fx-pane" data-pane="hero">

        <div id="picker_player"></div>

        <div class="fx-card">
          <div class="fx-card-title">Параметры героя</div>

          <div class="fx-grid2">
            <div class="fx-field">
              <label>Размер героя</label>
              <input id="fxPlayerSize" type="range" min="45" max="120">
            </div>

            <div class="fx-field">
              <label>Скорость</label>
              <input id="fxPlayerSpeed" type="range" min="140" max="400">
            </div>
          </div>

          <div class="fx-field">
            <label>Высота прыжка</label>
            <input id="fxJump" type="range" min="400" max="760">
          </div>

          <label class="fx-check">
            <input id="fxMirror" type="checkbox">
            Отражать героя при движении влево
          </label>
        </div>

      </div>

      <div class="fx-pane" data-pane="questionStyle">

        <div class="fx-card">
          <div class="fx-card-title">Шрифт</div>

          <div class="fx-field">
            <label>Стиль шрифта</label>
            <select id="fxFontFamily">
              <option value="Arial, sans-serif">Arial</option>
              <option value="Verdana, sans-serif">Verdana</option>
              <option value="Tahoma, sans-serif">Tahoma</option>
              <option value="Trebuchet MS, sans-serif">Trebuchet</option>
              <option value="Georgia, serif">Georgia</option>
              <option value="Courier New, monospace">Courier</option>
              <option value="Comic Sans MS, cursive">Comic Sans</option>
              <option value="system-ui, sans-serif">Системный</option>
            </select>
          </div>

          <div class="fx-grid2">
            <div class="fx-field">
              <label>Размер вопроса</label>
              <input id="fxQuestionSize" type="range" min="16" max="42">
            </div>

            <div class="fx-field">
              <label>Размер ответов</label>
              <input id="fxAnswerSize" type="range" min="14" max="34">
            </div>
          </div>
        </div>

        <div class="fx-card">
          <div class="fx-card-title">Карточка вопроса</div>

          <div class="fx-grid2">
            <div class="fx-field">
              <label>Фон</label>
              <input id="fxQuestionBg" type="color">
            </div>

            <div class="fx-field">
              <label>Цвет текста</label>
              <input id="fxQuestionText" type="color">
            </div>
          </div>

          <div class="fx-grid2">
            <div class="fx-field">
              <label>Цвет заголовка</label>
              <input id="fxQuestionTitle" type="color">
            </div>

            <div class="fx-field">
              <label>Цвет рамки</label>
              <input id="fxQuestionBorder" type="color">
            </div>
          </div>

          <div class="fx-grid3">
            <div class="fx-field">
              <label>Толщина рамки</label>
              <input id="fxQuestionBorderWidth" type="range" min="0" max="10">
            </div>

            <div class="fx-field">
              <label>Скругление</label>
              <input id="fxQuestionRadius" type="range" min="0" max="40">
            </div>

            <div class="fx-field">
              <label>Внутр. отступ</label>
              <input id="fxQuestionPadding" type="range" min="12" max="40">
            </div>
          </div>

          <label class="fx-check">
            <input id="fxQuestionShadow" type="checkbox">
            Тень карточки
          </label>
        </div>

        <div class="fx-card">
          <div class="fx-card-title">Варианты ответа</div>

          <div class="fx-grid2">
            <div class="fx-field">
              <label>Фон ответа</label>
              <input id="fxAnswerBg" type="color">
            </div>

            <div class="fx-field">
              <label>Цвет текста</label>
              <input id="fxAnswerText" type="color">
            </div>
          </div>

          <div class="fx-grid2">
            <div class="fx-field">
              <label>Цвет рамки</label>
              <input id="fxAnswerBorder" type="color">
            </div>

            <div class="fx-field">
              <label>Скругление</label>
              <input id="fxAnswerRadius" type="range" min="0" max="35">
            </div>
          </div>

          <div class="fx-field">
            <label>Толщина рамки</label>
            <input id="fxAnswerBorderWidth" type="range" min="0" max="8">
          </div>
        </div>

        <div class="fx-card">
          <div class="fx-card-title">Feedback</div>

          <div class="fx-grid2">
            <div class="fx-field">
              <label>Цвет «Верно»</label>
              <input id="fxCorrectColor" type="color">
            </div>

            <div class="fx-field">
              <label>Цвет «Ошибка»</label>
              <input id="fxWrongColor" type="color">
            </div>
          </div>

          <label class="fx-check">
            <input id="fxFeedbackPopup" type="checkbox">
            Большая плашка поверх задания
          </label>

<script>
(function(){
"use strict";

const root=document.getElementById("FX_ROOT");
if(!root || root.dataset.ready==="1") return;
root.dataset.ready="1";

const $=s=>root.querySelector(s);
const $$=s=>Array.from(root.querySelectorAll(s));

function blankImage(){
  return {mode:"builtin",value:""};
}

const defaults={
  title:"Большое приключение",
  accent:"#6f8063",

  colors:{
    sky:"#cfe8f5",
    ground:"#71965e",
    platform:"#b27d55",
    obstacle:"#a66f50"
  },

  images:{
    background:blankImage(),
    ground:blankImage(),
    platform:blankImage(),
    obstacle:blankImage(),
    player:blankImage(),
    taskItem:blankImage(),
    bonus:blankImage(),
    finish:blankImage(),
    startImage:blankImage()
  },

  player:{
    size:72,
    speed:250,
    jump:590,
    mirror:true
  },

  questionStyle:{
    font:"Arial, sans-serif",

    questionBg:"#ffffff",
    questionText:"#252525",
    questionTitle:"#252525",
    questionBorder:"#7c8c70",
    questionBorderWidth:3,
    questionRadius:20,
    questionPadding:22,
    questionSize:23,
    shadow:true,

    answerBg:"#f7f7f7",
    answerText:"#252525",
    answerBorder:"#d6d6d6",
    answerBorderWidth:2,
    answerRadius:12,
    answerSize:18,

    correctColor:"#4e9b5a",
    wrongColor:"#c75656",
    feedbackPopup:true,
    correctAnimation:true,
    wrongAnimation:true
  },

  taskItem:{
    icon:"⭐",
    size:68,
    animation:"float"
  },

  bonus:{
    enabled:true,
    count:16,
    icon:"🪙"
  },

  texts:{
    start:"Играть",
    instruction:"← → — движение\n↑ — прыжок\n↓ — спуститься с платформы",
    correct:"Верно!",
    wrong:"Попробуй ещё раз",
    finishTitle:"Отличная работа!",
    finishText:"Ты прошёл всю карту!"
  },

  settings:{
    showTaskCounter:true,
    showBonusCounter:true,
    showInstruction:true,
    lockFinish:true
  },

  tasks:[
    {
      id:1,
      type:"single",
      title:"Задание 1",
      text:"Сколько будет 7 + 5?",
      hint:"Посчитай от 7 ещё пять.",
      image:blankImage(),
      options:[
        {text:"10",image:blankImage(),correct:false},
        {text:"12",image:blankImage(),correct:true},
        {text:"14",image:blankImage(),correct:false}
      ],
      answer:""
    },
    {
      id:2,
      type:"manual",
      title:"Задание 2",
      text:"Назови главные члены предложения.",
      hint:"",
      image:blankImage(),
      options:[],
      answer:""
    }
  ]
};

let state=JSON.parse(JSON.stringify(defaults));
let nextTaskId=3;

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function getImage(obj){
  if(!obj || obj.mode==="builtin" || !obj.value) return "";
  return obj.value;
}

function readFile(file,cb){
  if(!file) return;

  const r=new FileReader();

  r.onload=()=>{
    cb(String(r.result||""));
  };

  r.readAsDataURL(file);
}

const pickerNames={
  background:"Фон игры",
  ground:"Земля",
  platform:"Платформы",
  obstacle:"Препятствия",
  player:"Герой",
  taskItem:"Предмет задания",
  bonus:"Коллекционный предмет",
  finish:"Финиш",
  startImage:"Картинка стартового экрана"
};

function renderImagePickers(){
  Object.keys(pickerNames).forEach(key=>{
    const mount=$("#picker_"+key);
    if(!mount) return;

    const data=state.images[key];

    mount.innerHTML=`
      <div class="fx-card">
        <div class="fx-card-title">${pickerNames[key]}</div>

        <div class="fx-image-card" data-picker="${key}">
          <div class="fx-source-tabs">

            <button
              type="button"
              class="fx-source-btn ${data.mode==="builtin"?"active":""}"
              data-mode="builtin"
            >
              Встроенное
            </button>

            <button
              type="button"
              class="fx-source-btn ${data.mode==="url"?"active":""}"
              data-mode="url"
            >
              URL
            </button>

            <button
              type="button"
              class="fx-source-btn ${data.mode==="upload"?"active":""}"
              data-mode="upload"
            >
              Файл
            </button>

          </div>

          <div class="${data.mode==="url"?"":"fx-hidden"}">
            <input
              type="text"
              data-role="url"
              value="${data.mode==="url"?esc(data.value):""}"
              placeholder="https://..."
            >

            <button
              type="button"
              class="fx-btn small"
              data-role="apply-url"
              style="margin-top:6px"
            >
              Применить
            </button>
          </div>

          <div class="${data.mode==="upload"?"":"fx-hidden"}">
            <input
              type="file"
              data-role="file"
              accept="image/png,image/jpeg,image/webp,image/gif"
            >
          </div>

          <img
            class="fx-thumb ${getImage(data)?"show":""}"
            src="${esc(getImage(data))}"
          >
        </div>
      </div>
    `;
  });
}

root.addEventListener("click",e=>{
  const picker=e.target.closest("[data-picker]");

  if(picker){
    const key=picker.dataset.picker;

    if(e.target.matches("[data-mode]")){
      state.images[key].mode=e.target.dataset.mode;

      if(state.images[key].mode==="builtin"){
        state.images[key].value="";
      }

      renderImagePickers();
      resetGame();
      return;
    }

    if(e.target.matches('[data-role="apply-url"]')){
      const url=picker.querySelector('[data-role="url"]').value.trim();

      state.images[key]={
        mode:"url",
        value:url
      };

      renderImagePickers();
      resetGame();
      return;
    }
  }
});

root.addEventListener("change",e=>{
  const picker=e.target.closest("[data-picker]");

  if(
    picker &&
    e.target.matches('[data-role="file"]')
  ){
    const key=picker.dataset.picker;

    readFile(e.target.files[0],data=>{
      state.images[key]={
        mode:"upload",
        value:data
      };

      renderImagePickers();
      resetGame();
    });
  }
});

const taskTypes=[
  {
    id:"single",
    title:"Один ответ",
    desc:"Один правильный вариант"
  },
  {
    id:"multi",
    title:"Несколько",
    desc:"Несколько правильных"
  },
  {
    id:"truefalse",
    title:"Верно / неверно",
    desc:"Две кнопки"
  },
  {
    id:"input",
    title:"Вписать ответ",
    desc:"Текстовое поле"
  },
  {
    id:"manual",
    title:"Устный ответ",
    desc:"Учитель проверяет сам"
  },
  {
    id:"image",
    title:"Выбор картинки",
    desc:"Ответы изображениями"
  }
];

function renderTasks(){
  const list=$("#fxTasksList");

  $("#fxTaskCount").textContent=
    "Добавлено: "+state.tasks.length;

  list.innerHTML="";

  state.tasks.forEach((task,index)=>{
    const card=document.createElement("div");
    card.className="fx-task-card";
    card.dataset.taskId=task.id;

    const typeButtons=taskTypes.map(t=>`
      <button
        type="button"
        class="fx-type-btn ${task.type===t.id?"active":""}"
        data-task-type="${t.id}"
      >
        ${t.title}
        <span>${t.desc}</span>
      </button>
    `).join("");

    const isChoice=
      task.type==="single" ||
      task.type==="multi" ||
      task.type==="image";

    let optionsHtml="";

    if(isChoice){
      optionsHtml=task.options.map((op,oi)=>`
        <div class="fx-option">

          <div class="fx-option-top">

            <input
              type="text"
              value="${esc(op.text)}"
              data-task-field="optionText"
              data-option-index="${oi}"
              placeholder="Текст ответа"
            >

            <label class="fx-check" style="margin:0">
              <input
                type="${task.type==="multi"?"checkbox":"radio"}"
                name="correct_${task.id}"
                data-task-field="optionCorrect"
                data-option-index="${oi}"
                ${op.correct?"checked":""}
              >
              Верно
            </label>

          </div>

          <div class="fx-answer-source">
            <input
              type="text"
              value="${op.image && op.image.mode==="url"?esc(op.image.value):""}"
              data-task-field="optionImageUrl"
              data-option-index="${oi}"
              placeholder="URL картинки"
            >

            <input
              type="file"
              accept="image/*"
              data-task-field="optionImageFile"
              data-option-index="${oi}"
            >
          </div>

        </div>
      `).join("");
    }

    let answerExtra="";

    if(task.type==="input"){
      answerExtra=`
        <div class="fx-field">
          <label>Правильный ответ</label>
          <input
            type="text"
            data-task-field="answer"
            value="${esc(task.answer)}"
          >
        </div>
      `;
    }

    if(task.type==="truefalse"){
      answerExtra=`
        <div class="fx-field">
          <label>Правильный ответ</label>

          <select data-task-field="answer">
            <option
              value="true"
              ${task.answer==="true"?"selected":""}
            >
              Верно
            </option>

            <option
              value="false"
              ${task.answer==="false"?"selected":""}
            >
              Неверно
            </option>
          </select>
        </div>
      `;
    }

    card.innerHTML=`
      <div class="fx-task-head">

        <div class="fx-task-num">
          Задание ${index+1}
        </div>

        <div class="fx-task-actions">
          <button class="fx-btn small" data-act="up">↑</button>
          <button class="fx-btn small" data-act="down">↓</button>
          <button class="fx-btn danger small" data-act="delete">×</button>
        </div>

      </div>

      <label>1. Выберите вид задания</label>

      <div class="fx-type-grid">
        ${typeButtons}
      </div>

      <div class="fx-field">
        <label>2. Заголовок</label>
        <input
          type="text"
          data-task-field="title"
          value="${esc(task.title)}"
        >
      </div>

      <div class="fx-field">
        <label>3. Текст задания</label>
        <textarea data-task-field="text">${esc(task.text)}</textarea>
      </div>

      <div class="fx-field">
        <label>Картинка к вопросу — URL</label>
        <input
          type="text"
          data-task-field="questionImageUrl"
          value="${
            task.image &&
            task.image.mode==="url"
              ? esc(task.image.value)
              : ""
          }"
          placeholder="https://..."
        >
      </div>

      <div class="fx-field">
        <label>Или загрузите картинку</label>
        <input
          type="file"
          accept="image/*"
          data-task-field="questionImageFile"
        >
      </div>

      ${
        isChoice
          ? `
            <label>4. Варианты ответа</label>
            ${optionsHtml}

            <button
              class="fx-btn small"
              data-act="add-option"
            >
              + Добавить вариант
            </button>
          `
          : ""
      }

      ${answerExtra}

      <div class="fx-field" style="margin-top:10px">
        <label>Подсказка</label>

        <input
          type="text"
          data-task-field="hint"
          value="${esc(task.hint)}"
          placeholder="Необязательно"
        >
      </div>
    `;

    list.appendChild(card);
  });
}

function newTask(){
  return {
    id:nextTaskId++,
    type:"single",
    title:"Новое задание",
    text:"Введите текст задания",
    hint:"",
    image:blankImage(),
    options:[
      {
        text:"Ответ 1",
        image:blankImage(),
        correct:true
      },
      {
        text:"Ответ 2",
        image:blankImage(),
        correct:false
      }
    ],
    answer:""
  };
}

$("#fxAddTask").addEventListener("click",()=>{
  state.tasks.push(newTask());
  renderTasks();
  resetGame();
});

$("#fxTasksList").addEventListener("click",e=>{
  const card=e.target.closest(".fx-task-card");
  if(!card) return;

  const id=Number(card.dataset.taskId);
  const index=state.tasks.findIndex(t=>t.id===id);

  if(index<0) return;

  const task=state.tasks[index];

  if(e.target.matches("[data-task-type]")){
    task.type=e.target.dataset.taskType;

    if(
      (
        task.type==="single" ||
        task.type==="multi" ||
        task.type==="image"
      ) &&
      !task.options.length
    ){
      task.options=[
        {
          text:"Ответ 1",
          image:blankImage(),
          correct:true
        },
        {
          text:"Ответ 2",
          image:blankImage(),
          correct:false
        }
      ];
    }

    if(task.type==="truefalse" && !task.answer){
      task.answer="true";
    }

    renderTasks();
    return;
  }

  const act=e.target.dataset.act;

  if(act==="delete"){
    state.tasks.splice(index,1);
    renderTasks();
    resetGame();
  }

  if(act==="up" && index>0){
    [
      state.tasks[index-1],
      state.tasks[index]
    ]=[
      state.tasks[index],
      state.tasks[index-1]
    ];

    renderTasks();
    resetGame();
  }

  if(
    act==="down" &&
    index<state.tasks.length-1
  ){
    [
      state.tasks[index+1],
      state.tasks[index]
    ]=[
      state.tasks[index],
      state.tasks[index+1]
    ];

    renderTasks();
    resetGame();
  }

  if(act==="add-option"){
    task.options.push({
      text:"Новый вариант",
      image:blankImage(),
      correct:false
    });

    renderTasks();
  }
});

$("#fxTasksList").addEventListener("input",e=>{
  const card=e.target.closest(".fx-task-card");
  if(!card) return;

  const task=state.tasks.find(
    t=>t.id===Number(card.dataset.taskId)
  );

  if(!task) return;

  const field=e.target.dataset.taskField;

  if(field==="title"){
    task.title=e.target.value;
  }

  if(field==="text"){
    task.text=e.target.value;
  }

  if(field==="hint"){
    task.hint=e.target.value;
  }

  if(field==="answer"){
    task.answer=e.target.value;
  }

  if(field==="questionImageUrl"){
    task.image={
      mode:"url",
      value:e.target.value.trim()
    };
  }

  if(field==="optionText"){
    const oi=Number(
      e.target.dataset.optionIndex
    );

    task.options[oi].text=e.target.value;
  }

  if(field==="optionImageUrl"){
    const oi=Number(
      e.target.dataset.optionIndex
    );

    task.options[oi].image={
      mode:"url",
      value:e.target.value.trim()
    };
  }
});

$("#fxTasksList").addEventListener("change",e=>{
  const card=e.target.closest(".fx-task-card");
  if(!card) return;

  const task=state.tasks.find(
    t=>t.id===Number(card.dataset.taskId)
  );

  if(!task) return;

  const field=e.target.dataset.taskField;

  if(field==="optionCorrect"){
    const oi=Number(
      e.target.dataset.optionIndex
    );

    if(task.type==="multi"){
      task.options[oi].correct=
        e.target.checked;
    }else{
      task.options.forEach((op,i)=>{
        op.correct=i===oi;
      });

      renderTasks();
    }
  }

  if(field==="questionImageFile"){
    readFile(
      e.target.files[0],
      data=>{
        task.image={
          mode:"upload",
          value:data
        };
      }
    );
  }

  if(field==="optionImageFile"){
    const oi=Number(
      e.target.dataset.optionIndex
    );

    readFile(
      e.target.files[0],
      data=>{
        task.options[oi].image={
          mode:"upload",
          value:data
        };
      }
    );
  }

  if(field==="answer"){
    task.answer=e.target.value;
  }
});

function bindField(
  selector,
  getter,
  setter,
  redraw
){
  const el=$(selector);

  const handler=()=>{
    setter(
      el.type==="checkbox"
        ? el.checked
        : el.value
    );

    applyVisualStyle();

    if(redraw){
      resetGame();
    }
  };

  el.addEventListener(
    "input",
    handler
  );

  el.addEventListener(
    "change",
    handler
  );
}

function makeMap(taskCount){

  const W=980;

  const ground=[];
  const platforms=[];
  const obstacles=[];
  const tasks=[];
  const bonuses=[];

  for(let s=0;s<sections;s++){
    const x=s*W;

    ground.push(
      {
        x:x,
        y:0,
        w:280,
        h:46
      },
      {
        x:x+390,
        y:0,
        w:590,
        h:46
      }
    );

    platforms.push(
      {
        x:x+130,
        y:145,
        w:190,
        h:28

        y:245,
        w:190,
        h:28

        y:350,
        w:210,
        h:28
      },
      {
        x:x+790,
        y:220,
        w:155,
        h:28
      }
    );

    obstacles.push(
      {
        x:x+65,
        y:46,
        w:78,
        h:85
      },
      {
        x:x+455,
        y:46,
        w:95,
        h:110
      },
      {
        x:x+850,
        y:46,
        w:80,
        h:135
      }
    );

    tasks.push(
      {
        x:x+185,
        y:205
      },

      },
      {
        x:x+640,

    bonuses.push(

  e.className=
    "fx-obj "+cls;

  e.style.left=

  e.style.bottom=
    r.y+"px";

  e.style.width=
    r.w+"px";

  e.style.height=

    x:75,
    y:46,

    vx:0,
    vy:0,

    grounded:false,

    camera:0,

function overlap(a,b){
  return (
    a.x<b.x+b.w &&
    a.x+a.w>b.x &&
    a.y<b.y+b.h &&
    a.y+a.h>b.y
  );
}

function jump(){
  if(
    game.started &&
    !game.paused &&
    game.grounded
  ){
    game.vy=
      state.player.jump;

    game.grounded=false;
  }
}

function update(dt){
  const pw=
    state.player.size*.72;

  const ph=
    state.player.size;

  let dir=0;

  if(game.keys.left) dir--;
  if(game.keys.right) dir++;

  game.vx=
    dir*
    state.player.speed;

  let nx=
    game.x+
    game.vx*dt;

  const test={
    x:nx,
    y:game.y,
    w:pw,
    h:ph
  };

  for(
    const o
    of game.map.obstacles
  ){
    if(overlap(test,o)){
      if(game.vx>0){
        nx=
          o.x-pw-.1;
      }

      if(game.vx<0){
        nx=
          o.x+o.w+.1;
      }

      break;
    }
  }

  game.x=
    clamp(
      nx,
      0,
      game.map.width-pw
    );

  game.vy-=1200*dt;

  let ny=
    game.y+
    game.vy*dt;

  let landed=false;

  const surfaces=[
    ...game.map.ground,
    ...game.map.platforms
  ];

  if(game.vy<=0){
    for(const s of surfaces){
      const top=
        s.y+s.h;

      const horizontal=
        game.x+pw>s.x &&
        game.x<s.x+s.w;

      const above=
        game.y>=top-4;

      const crosses=
        ny<=top;

      if(
        horizontal &&
        above &&
        crosses
      ){
        ny=top;
        game.vy=0;
        landed=true;
        break;
      }
    }
  }

  game.y=ny;
  game.grounded=landed;

  if(landed){
    game.safeX=
      game.x;
  }

  if(game.y<-160){
    game.x=
      game.safeX;

    game.y=220;
    game.vy=0;
  }

  checkTasks(pw,ph);
  checkBonuses(pw,ph);
  checkFinish(pw,ph);
}

function draw(){
  const player=
    $("#fxPlayerObject");

  if(!player) return;

  const viewport=
    $("#fxStage").clientWidth;

  game.camera=
    clamp(
      game.x-
      viewport*.34,
      0,
      Math.max(
        0,
        game.map.width-
        viewport
      )
    );

  $("#fxWorld").style.transform=
    "translateX("+
    (-game.camera)+
    "px)";

  player.style.left=
    game.x+"px";

  player.style.bottom=
    game.y+"px";

  if(state.player.mirror){
    if(game.vx<0){
      player.style.transform=
        "scaleX(-1)";
    }

    if(game.vx>0){
      player.style.transform=
        "scaleX(1)";
    }
  }
}

function checkTasks(pw,ph){
  const pr={
    x:game.x,
    y:game.y,
    w:pw,
    h:ph
  };

  game.map.tasks.forEach(
    (p,i)=>{
      if(
        game.completed.has(i)
      ){
        return;
      }

      const s=
        state.taskItem.size;

      if(
        overlap(
          pr,
          {
            x:p.x,
            y:p.y,
            w:s,
            h:s
          }
        )
      ){
        openTask(i);
      }
    }
  );
}

function checkBonuses(pw,ph){
  if(!state.bonus.enabled){
    return;
  }

  const pr={
    x:game.x,
    y:game.y,
    w:pw,
    h:ph
  };

  game.map.bonuses
    .slice(
      0,
      Math.min(
        state.bonus.count,
        game.map.bonuses.length
      )
    )
    .forEach((p,i)=>{
      if(
        game.collected.has(i)
      ){
        return;
      }

      if(
        overlap(
          pr,
          {
            x:p.x,
            y:p.y,
            w:38,
            h:38
          }
        )
      ){
        game.collected.add(i);

        const el=
          $("#fxWorld")
          .querySelector(
            '[data-bonus="'+
            i+
            '"]'
          );

        if(el){
          el.remove();
        }

        renderHud();
      }
    });
}

function checkFinish(pw,ph){
  const pr={
    x:game.x,
    y:game.y,
    w:pw,
    h:ph
  };

  if(
    !overlap(
      pr,
      {
        x:game.map.finishX,
        y:46,
        w:75,
        h:125
      }
    )
  ){
    return;
  }

  if(
    state.settings.lockFinish &&
    game.completed.size<
    state.tasks.length
  ){
    showToast(
      "Выполни все задания: "+
      game.completed.size+
      "/"+
      state.tasks.length
    );

    return;
  }

  finishGame();
}

function openTask(index){
  if(game.paused) return;

  const task=
    state.tasks[index];

  if(!task) return;

  game.paused=true;
  game.activeTask=index;
  game.selectedAnswers.clear();

  $("#fxTaskTitlePreview")
    .textContent=
    task.title||
    ("Задание "+(index+1));

  $("#fxTaskTextPreview")
    .textContent=
    task.text||"";

  $("#fxFeedback")
    .textContent="";

  const qimg=
    getImage(task.image);

  const qel=
    $("#fxQuestionImgPreview");

  if(qimg){
    qel.src=qimg;
    qel.classList.remove(
      "fx-hidden"
    );
  }else{
    qel.classList.add(
      "fx-hidden"
    );
  }

  const hintBtn=
    $("#fxHintBtn");

  const hintBox=
    $("#fxHintPreview");

  hintBox.classList.add(
    "fx-hidden"
  );

  if(task.hint){
    hintBtn.classList.remove(
      "fx-hidden"
    );

    hintBtn.onclick=()=>{
      hintBox.textContent=
        task.hint;

      hintBox.classList.remove(
        "fx-hidden"
      );
    };
  }else{
    hintBtn.classList.add(
      "fx-hidden"
    );
  }

  renderAnswers(
    task,
    index
  );

  $("#fxTaskOverlay")
    .classList.remove(
      "fx-hidden"
    );
}

function renderAnswers(
  task,
  index
){
  const box=
    $("#fxAnswersPreview");

  box.innerHTML="";

  if(task.type==="manual"){
    const btn=
      document.createElement(
        "button"
      );

    btn.className=
      "fx-btn primary";

    btn.textContent=
      "Готово";

    btn.onclick=()=>{
      completeTask(index);
    };

    box.appendChild(btn);
    return;
  }

  if(
    task.type===
    "truefalse"
  ){
    [
      {
        label:"Верно",
        value:"true"
      },
      {
        label:"Неверно",
        value:"false"
      }
    ].forEach(item=>{
      const btn=
        document.createElement(
          "button"
        );

      btn.className=
        "fx-answer-btn";

      btn.textContent=
        item.label;

      btn.onclick=()=>{
        checkAnswer(
          item.value===
          task.answer,
          index
        );
      };

      box.appendChild(btn);
    });

    return;
  }

  if(task.type==="input"){
    const inp=
      document.createElement(
        "input"
      );

    inp.className=
      "fx-text-answer";

    inp.type="text";

    inp.placeholder=
      "Введите ответ";

    const btn=
      document.createElement(
        "button"
      );

    btn.className=
      "fx-btn primary";

    btn.textContent=
      "Проверить";

    btn.onclick=()=>{
      const a=
        String(inp.value)
        .trim()
        .toLowerCase();

      const b=
        String(task.answer)
        .trim()
        .toLowerCase();

      checkAnswer(
        a===b,
        index
      );
    };

    box.appendChild(inp);
    box.appendChild(btn);
    return;
  }

  task.options.forEach(
    (option,oi)=>{
      const btn=
        document.createElement(
          "button"
        );

      btn.className=
        "fx-answer-btn";

      const img=
        getImage(
          option.image
        );

      if(img){
        const im=
          document.createElement(
            "img"
          );

        im.src=img;
        btn.appendChild(im);
      }

      if(option.text){
        const span=
          document.createElement(
            "span"
          );

        span.textContent=
          option.text;

        btn.appendChild(span);
      }

      if(task.type==="multi"){
        btn.onclick=()=>{
          if(
            game.selectedAnswers
            .has(oi)
          ){
            game.selectedAnswers
              .delete(oi);

            btn.classList.remove(
              "selected"
            );
          }else{
            game.selectedAnswers
              .add(oi);

            btn.classList.add(
              "selected"
            );
          }
        };
      }else{
        btn.onclick=()=>{
          checkAnswer(
            !!option.correct,
            index
          );
        };
      }

      box.appendChild(btn);
    }
  );

  if(task.type==="multi"){
    const checkBtn=
      document.createElement(
        "button"
      );

    checkBtn.className=
      "fx-btn primary";

    checkBtn.textContent=
      "Проверить";

    checkBtn.onclick=()=>{
      const correct=
        task.options
        .map((o,i)=>
          o.correct
            ? i
            : -1
        )
        .filter(i=>i>=0);

      const selected=
        Array.from(
          game.selectedAnswers
        )
        .sort((a,b)=>a-b);

      const ok=
        selected.length===
        correct.length &&
        selected.every(
          (v,i)=>
            v===
            correct[i]
        );

      checkAnswer(
        ok,
        index
      );
    };

    box.appendChild(
      checkBtn
    );
  }
}

function showFeedback(
  type,
  text
){
  const q=
    $("#fxQuestionCard");

  const badge=
    $("#fxFeedbackBadge");

  q.classList.remove(
    "fx-correct-flash",
    "fx-wrong-shake"
  );

  if(type==="correct"){
    $("#fxFeedback")
      .style.color=
      state.questionStyle
      .correctColor;

    if(
      state.questionStyle
      .correctAnimation
    ){
      q.classList.add(
        "fx-correct-flash"
      );
    }
  }else{
    $("#fxFeedback")
      .style.color=
      state.questionStyle
      .wrongColor;

    if(
      state.questionStyle
      .wrongAnimation
    ){
      q.classList.add(
        "fx-wrong-shake"
      );
    }
  }

  $("#fxFeedback")
    .textContent=
    text;

  if(
    state.questionStyle
    .feedbackPopup
  ){
    badge.textContent=
      type==="correct"
        ? "✓ "+text
        : "✕ "+text;

    badge.className=
      "fx-feedback-badge "+
      type;

    badge.classList.remove(
      "fx-hidden"
    );

    setTimeout(()=>{
      badge.classList.add(
        "fx-hidden"
      );
    },700);
  }
}

function checkAnswer(
  ok,
  index
){
  if(ok){
    showFeedback(
      "correct",
      state.texts.correct
    );

    setTimeout(()=>{
      completeTask(index);
    },650);
  }else{
    showFeedback(
      "wrong",
      state.texts.wrong
    );
  }
}

function completeTask(index){
  game.completed.add(index);

  const item=
    $("#fxWorld")
    .querySelector(
      '[data-task="'+
      index+
      '"]'
    );

  if(item){
    item.remove();
  }

  $("#fxTaskOverlay")
    .classList.add(
      "fx-hidden"
    );

  game.activeTask=-1;
  game.paused=false;

  renderHud();

  $("#fxStage").focus();
}

function finishGame(){
  if(game.done) return;

  game.done=true;
  game.paused=true;

  $("#fxFinishTitlePreview")
    .textContent=
    state.texts.finishTitle;

  $("#fxFinishTextPreview")
    .textContent=
    state.texts.finishText+
    "\n\nЗадания: "+
    game.completed.size+
    "/"+
    state.tasks.length;

  $("#fxFinishOverlay")
    .classList.remove(
      "fx-hidden"
    );
}

let toastTimer=0;

function showToast(text){
  clearTimeout(
    toastTimer
  );

  const el=
    $("#fxToast");

  el.textContent=text;

  el.classList.remove(
    "fx-hidden"
  );

  toastTimer=
    setTimeout(()=>{
      el.classList.add(
        "fx-hidden"
      );
    },1400);
}

function startLoop(){
  function frame(now){
    const dt=
      Math.min(
        (now-game.last)/1000,
        .032
      );

    game.last=now;

    if(
      game.started &&
      !game.paused &&
      !game.done
    ){
      update(dt);
    }

    draw();

    game.raf=
      requestAnimationFrame(
        frame
      );
  }

  game.raf=
    requestAnimationFrame(
      frame
    );
}

$("#fxStartBtn")
.addEventListener(
  "click",
  ()=>{
    game.started=true;

    $("#fxStartOverlay")
      .classList.add(
        "fx-hidden"
      );

    $("#fxStage")
      .focus();
  }
);

$("#fxAgainBtn")
.addEventListener(
  "click",
  resetGame
);

$("#fxRestartBtn")
.addEventListener(
  "click",
  resetGame
);

$("#fxRestartPreview")
.addEventListener(
  "click",
  resetGame
);

$("#fxStage")
.addEventListener(
  "pointerdown",
  ()=>{
    $("#fxStage")
      .focus();
  }
);

$("#fxStage")
.addEventListener(
  "keydown",
  e=>{
    if(
      [
        "ArrowLeft",
        "ArrowRight",
        "ArrowUp",
        "ArrowDown"
      ].includes(e.key)
    ){
      e.preventDefault();
    }

    if(
      e.key==="ArrowLeft"
    ){
      game.keys.left=true;
    }

    if(
      e.key==="ArrowRight"
    ){
      game.keys.right=true;
    }

    if(
      e.key==="ArrowUp"
    ){
      if(!game.keys.up){
        jump();
      }

      game.keys.up=true;
    }

    if(
      e.key==="ArrowDown"
    ){
      game.keys.down=true;

      if(game.grounded){
        game.y-=12;
        game.vy=-120;
      }
    }
  }
);

$("#fxStage")
.addEventListener(
  "keyup",
  e=>{
    if(
      e.key==="ArrowLeft"
    ){
      game.keys.left=false;
    }

    if(
      e.key==="ArrowRight"
    ){
      game.keys.right=false;
    }

    if(
      e.key==="ArrowUp"
    ){
      game.keys.up=false;
    }

    if(
      e.key==="ArrowDown"
    ){
      game.keys.down=false;
    }
  }
);

$("#fxResetBtn")
.addEventListener(
  "click",
  ()=>{
    state=
      JSON.parse(
        JSON.stringify(
          defaults
        )
      );

    nextTaskId=3;

    syncInputs();
    renderImagePickers();
    renderTasks();
    resetGame();
  }
);

function safeJSON(obj){
  return JSON.stringify(obj)
    .replace(/</g,"\\u003c")
    .replace(/>/g,"\\u003e")
    .replace(/&/g,"\\u0026");
}

function generateStandaloneGame(){
  const data=safeJSON(state);

  const editorCopy=
    root.cloneNode(true);

  return `
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
}
</style>
</head>
<body>
<div id="fx_export_mount"></div>
<script>
const FX_STATE=${data};
<\/script>
</body>
</html>
`;
}

function generateIframe(){
  const html=
    generateStandaloneGame();

  return (
    '<iframe src="data:text/html;charset=utf-8,'+
    encodeURIComponent(html)+
    '" width="100%" height="650" '+
    'style="border:0;width:100%;display:block;" '+
    'allow="fullscreen"></iframe>'
  );
}

async function copyCode(){
  const code=
    generateIframe();

  $("#fxCode").value=
    code;

  try{
    await navigator.clipboard
      .writeText(code);

    $("#fxPublishStatus")
      .textContent=
      "✓ Код скопирован";
  }catch(err){
    $("#fxCode")
      .classList.remove(
        "fx-hidden"
      );

    $("#fxCode")
      .select();

    $("#fxPublishStatus")
      .textContent=
      "Скопируйте код из поля вручную";
  }
}

$("#fxCopyBtn")
.addEventListener(
  "click",
  copyCode
);

$("#fxQuickCopyBtn")
.addEventListener(
  "click",
  copyCode
);

$("#fxShowCodeBtn")
.addEventListener(
  "click",
  ()=>{
    $("#fxCode").value=
      generateIframe();

    $("#fxCode")
      .classList.toggle(
        "fx-hidden"
      );
  }
);

syncInputs();
bindAll();
renderImagePickers();
renderTasks();
resetGame();

})();
</script>
