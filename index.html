<div id="FX_ROOT">
<style>
#FX_ROOT{
  --accent:#6f8063;
  --accent2:#e9efe4;
  --panel:#ffffff;
  --page:#f5f3ee;
  --line:#dedbd4;
  --text:#272727;
  --muted:#777;
  font-family:Arial,sans-serif;
  color:var(--text);
  width:100%;
}
#FX_ROOT *{box-sizing:border-box}
#FX_ROOT button,#FX_ROOT input,#FX_ROOT select,#FX_ROOT textarea{font:inherit}
#FX_ROOT button{cursor:pointer}

#FX_ROOT .fx-shell{
  background:var(--page);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
}
#FX_ROOT .fx-top{
  background:white;
  border-bottom:1px solid var(--line);
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
#FX_ROOT .fx-title{
  font-size:20px;
  font-weight:800;
}
#FX_ROOT .fx-top-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

#FX_ROOT .fx-tabs{
  display:flex;
  gap:4px;
  padding:9px;
  background:white;
  border-bottom:1px solid var(--line);
  overflow:auto;
}
#FX_ROOT .fx-tab{
  white-space:nowrap;
  border:0;
  background:#f0eee8;
  padding:9px 12px;
  border-radius:9px;
  font-weight:700;
  color:#555;
}
#FX_ROOT .fx-tab.active{
  background:var(--accent);
  color:white;
}

#FX_ROOT .fx-main{
  display:grid;
  grid-template-columns:minmax(310px,410px) minmax(0,1fr);
  gap:14px;
  padding:14px;
}
#FX_ROOT .fx-controls{
  min-width:0;
}
#FX_ROOT .fx-pane{display:none}
#FX_ROOT .fx-pane.active{display:block}

#FX_ROOT .fx-card{
  background:white;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
  margin-bottom:11px;
}
#FX_ROOT .fx-card-title{
  font-weight:800;
  margin-bottom:10px;
}
#FX_ROOT .fx-field{margin-bottom:10px}
#FX_ROOT label{
  font-size:12px;
  font-weight:700;
  display:block;
  margin-bottom:5px;
}
#FX_ROOT input[type=text],
#FX_ROOT input[type=number],
#FX_ROOT select,
#FX_ROOT textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:9px;
  padding:9px 10px;
  background:white;
  color:#222;
}
#FX_ROOT textarea{
  min-height:75px;
  resize:vertical;
}
#FX_ROOT input[type=color]{
  width:100%;
  height:38px;
  border:1px solid var(--line);
  border-radius:9px;
  background:white;
}
#FX_ROOT input[type=range]{width:100%}
#FX_ROOT input[type=file]{width:100%;font-size:12px}

#FX_ROOT .fx-grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
#FX_ROOT .fx-check{
  display:flex;
  gap:8px;
  align-items:center;
  margin:8px 0;
  font-size:13px;
}
#FX_ROOT .fx-check input{margin:0}

#FX_ROOT .fx-btn{
  border:0;
  border-radius:9px;
  padding:9px 12px;
  background:#e8e6e0;
  color:#333;
  font-weight:700;
}
#FX_ROOT .fx-btn.primary{
  background:var(--accent);
  color:#fff;
}
#FX_ROOT .fx-btn.danger{
  background:#f5dede;
  color:#8c3333;
}
#FX_ROOT .fx-btn.small{
  padding:6px 8px;
  font-size:12px;
}
#FX_ROOT .fx-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

#FX_ROOT .fx-img-picker{
  border:1px dashed #ccc7bd;
  padding:9px;
  border-radius:11px;
  background:#faf9f6;
}
#FX_ROOT .fx-source-tabs{
  display:flex;
  gap:5px;
  margin-bottom:8px;
  flex-wrap:wrap;
}
#FX_ROOT .fx-source-btn{
  border:0;
  padding:6px 9px;
  border-radius:8px;
  font-size:12px;
  background:#eceae4;
}
#FX_ROOT .fx-source-btn.active{
  background:var(--accent2);
  color:#3f5239;
  font-weight:700;
}
#FX_ROOT .fx-thumb{
  display:none;
  margin-top:8px;
  width:90px;
  height:62px;
  object-fit:contain;
  border:1px solid var(--line);
  border-radius:8px;
  background:white;
}
#FX_ROOT .fx-thumb.show{display:block}

#FX_ROOT .fx-task-card{
  border:1px solid var(--line);
  background:#faf9f6;
  border-radius:12px;
  padding:10px;
  margin-bottom:9px;
}
#FX_ROOT .fx-task-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:7px;
  margin-bottom:8px;
}
#FX_ROOT .fx-task-num{font-weight:800}
#FX_ROOT .fx-task-actions{display:flex;gap:4px}
#FX_ROOT .fx-option{
  border:1px solid var(--line);
  border-radius:9px;
  padding:8px;
  margin-bottom:6px;
  background:white;
}
#FX_ROOT .fx-option-top{
  display:grid;
  grid-template-columns:1fr 70px;
  gap:6px;
  align-items:center;
}
#FX_ROOT .fx-option-img{
  margin-top:6px;
}

#FX_ROOT .fx-preview-wrap{
  min-width:0;
  position:sticky;
  top:10px;
}
#FX_ROOT .fx-preview-toolbar{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-bottom:8px;
  align-items:center;
  flex-wrap:wrap;
}
#FX_ROOT .fx-device-buttons{
  display:flex;
  gap:5px;
}
#FX_ROOT .fx-device-buttons button{
  border:0;
  border-radius:8px;
  padding:6px 8px;
}
#FX_ROOT .fx-device-buttons button.active{
  background:var(--accent);
  color:white;
}

#FX_ROOT .fx-preview-frame{
  margin:auto;
  transition:.2s;
}
#FX_ROOT .fx-preview-frame.desktop{width:100%}
#FX_ROOT .fx-preview-frame.tablet{width:min(760px,100%)}
#FX_ROOT .fx-preview-frame.phone{width:min(390px,100%)}

#FX_ROOT .fx-stage{
  width:100%;
  aspect-ratio:16/9;
  min-height:360px;
  background:#cfe8f5;
  border-radius:16px;
  border:1px solid var(--line);
  overflow:hidden;
  position:relative;
  outline:none;
  user-select:none;
}
#FX_ROOT .fx-stage:focus{
  box-shadow:0 0 0 3px rgba(111,128,99,.22);
}
#FX_ROOT .fx-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
}
#FX_ROOT .fx-world{
  position:absolute;
  left:0;
  bottom:0;
  height:100%;
  will-change:transform;
}
#FX_ROOT .fx-obj{position:absolute}
#FX_ROOT .fx-ground{
  background:#759c62;
  border-top:4px solid rgba(255,255,255,.35);
}
#FX_ROOT .fx-platform{
  background:#b68861;
  border-top:4px solid #759c62;
  border-radius:7px 7px 3px 3px;
}
#FX_ROOT .fx-obstacle{
  background:#a57555;
  border:3px solid rgba(0,0,0,.1);
  border-radius:7px;
}
#FX_ROOT .fx-player{
  z-index:20;
  border-radius:14px;
  background:#e57a67;
  border:3px solid white;
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center bottom;
  transform-origin:center center;
}
#FX_ROOT .fx-player.image{
  background-color:transparent;
  border:0;
}
#FX_ROOT .fx-task-item,
#FX_ROOT .fx-bonus-item{
  z-index:15;
  display:flex;
  justify-content:center;
  align-items:center;
  background-size:contain;
  background-position:center;
  background-repeat:no-repeat;
}
#FX_ROOT .fx-task-item{
  animation:fxFloat 1.6s ease-in-out infinite;
}
#FX_ROOT .fx-bonus-item{
  animation:fxPulse 1.4s ease-in-out infinite;
}
#FX_ROOT .fx-finish{
  z-index:10;
  width:54px;
  height:88px;
  background-size:contain;
  background-position:center bottom;
  background-repeat:no-repeat;
}
#FX_ROOT .fx-finish.flag:before{
  content:"";
  position:absolute;
  width:5px;
  height:88px;
  background:white;
  left:8px;
}
#FX_ROOT .fx-finish.flag:after{
  content:"";
  position:absolute;
  width:40px;
  height:28px;
  background:#e75f61;
  left:13px;
  top:5px;
  clip-path:polygon(0 0,100% 50%,0 100%);
}

#FX_ROOT .fx-hud{
  position:absolute;
  z-index:50;
  top:10px;
  left:10px;
  display:flex;
  gap:7px;
}
#FX_ROOT .fx-pill{
  background:rgba(255,255,255,.9);
  padding:7px 10px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
}

#FX_ROOT .fx-overlay{
  position:absolute;
  inset:0;
  z-index:100;
  background:rgba(20,20,20,.46);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}
#FX_ROOT .fx-hidden{display:none!important}
#FX_ROOT .fx-modal{
  width:min(540px,96%);
  max-height:92%;
  overflow:auto;
  background:white;
  border-radius:17px;
  padding:18px;
}
#FX_ROOT .fx-modal h2{
  margin:0 0 9px;
  font-size:22px;
}
#FX_ROOT .fx-modal p{
  white-space:pre-wrap;
  line-height:1.45;
}
#FX_ROOT .fx-question-img{
  max-width:100%;
  max-height:190px;
  display:block;
  margin:8px auto 12px;
  object-fit:contain;
  border-radius:10px;
}
#FX_ROOT .fx-answer-btn{
  width:100%;
  display:flex;
  gap:9px;
  align-items:center;
  text-align:left;
  padding:9px 11px;
  margin:6px 0;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fafafa;
}
#FX_ROOT .fx-answer-btn img{
  width:70px;
  height:55px;
  object-fit:contain;
  border-radius:7px;
}
#FX_ROOT .fx-answer-btn.selected{
  outline:2px solid var(--accent);
  background:var(--accent2);
}
#FX_ROOT .fx-feedback{
  font-weight:800;
  min-height:22px;
  margin-top:8px;
}
#FX_ROOT .fx-hint{
  background:#fff8dd;
  border:1px solid #e7dca5;
  border-radius:9px;
  padding:9px;
  margin:8px 0;
}
#FX_ROOT .fx-text-answer{
  margin:7px 0;
}
#FX_ROOT .fx-toast{
  position:absolute;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  z-index:130;
  padding:9px 13px;
  border-radius:999px;
  background:rgba(25,25,25,.9);
  color:white;
  font-size:13px;
}

#FX_ROOT .fx-code{
  width:100%;
  min-height:180px;
  font-family:monospace;
  font-size:11px;
}
#FX_ROOT .fx-status{
  font-size:12px;
  color:var(--muted);
  margin-top:8px;
}

@keyframes fxFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}
@keyframes fxPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.12)}
}

@media(max-width:930px){
  #FX_ROOT .fx-main{grid-template-columns:1fr}
  #FX_ROOT .fx-preview-wrap{position:static}
}
@media(max-width:520px){
  #FX_ROOT .fx-grid2{grid-template-columns:1fr}
  #FX_ROOT .fx-stage{min-height:250px}
}
</style>

<div class="fx-shell">
  <div class="fx-top">
    <div class="fx-title">🎮 Конструктор платформенной игры</div>
    <div class="fx-top-actions">
      <button class="fx-btn" id="fxResetBtn">Сбросить</button>
      <button class="fx-btn primary" id="fxRestartBtn">▶ Тест-драйв</button>
      <button class="fx-btn primary" id="fxQuickCopyBtn">Копировать код</button>
    </div>
  </div>

  <div class="fx-tabs" id="fxTabs">
    <button class="fx-tab active" data-tab="design">🎨 Оформление</button>
    <button class="fx-tab" data-tab="hero">👤 Герой</button>
    <button class="fx-tab" data-tab="tasks">❓ Задания</button>
    <button class="fx-tab" data-tab="items">🎁 Предметы</button>
    <button class="fx-tab" data-tab="settings">⚙️ Настройки</button>
    <button class="fx-tab" data-tab="preview">👁 Предпросмотр</button>
    <button class="fx-tab" data-tab="publish">📤 Публикация</button>
  </div>

  <div class="fx-main">
    <div class="fx-controls">

      <div class="fx-pane active" data-pane="design">
        <div class="fx-card">
          <div class="fx-card-title">Основное</div>
          <div class="fx-field">
            <label>Название игры</label>
            <input id="fxTitle" type="text">
          </div>
          <div class="fx-grid2">
            <div class="fx-field">
              <label>Цвет интерфейса</label>
              <input id="fxAccent" type="color">
            </div>
            <div class="fx-field">
              <label>Цвет неба</label>
              <input id="fxSky" type="color">
            </div>
          </div>
        </div>

        <div id="picker_background"></div>
        <div id="picker_ground"></div>
        <div id="picker_platform"></div>
        <div id="picker_obstacle"></div>
        <div id="picker_startImage"></div>
      </div>

      <div class="fx-pane" data-pane="hero">
        <div class="fx-card">
          <div class="fx-card-title">Персонаж</div>
          <div id="picker_player"></div>

          <div class="fx-grid2">
            <div class="fx-field">
              <label>Размер героя</label>
              <input id="fxPlayerSize" type="range" min="30" max="85">
            </div>
            <div class="fx-field">
              <label>Скорость</label>
              <input id="fxPlayerSpeed" type="range" min="120" max="360">
            </div>
          </div>

          <div class="fx-field">
            <label>Высота прыжка</label>
            <input id="fxJump" type="range" min="360" max="680">
          </div>

          <label class="fx-check">
            <input id="fxMirror" type="checkbox">
            Отражать героя при движении влево
          </label>
        </div>
      </div>

      <div class="fx-pane" data-pane="tasks">
        <div class="fx-card">
          <div class="fx-task-head">
            <div>
              <div class="fx-card-title" style="margin:0">Задания</div>
              <div id="fxTaskCount" class="fx-status"></div>
            </div>
            <button class="fx-btn primary small" id="fxAddTask">+ Добавить</button>
          </div>
          <div id="fxTasksList"></div>
        </div>
      </div>

      <div class="fx-pane" data-pane="items">
        <div id="picker_taskItem"></div>
        <div class="fx-card">
          <div class="fx-card-title">Предмет задания</div>
          <div class="fx-field">
            <label>Размер</label>
            <input id="fxTaskSize" type="range" min="22" max="70">
          </div>
          <div class="fx-field">
            <label>Встроенная иконка</label>
            <select id="fxTaskIcon">
              <option value="⭐">⭐ Звезда</option>
              <option value="💎">💎 Кристалл</option>
              <option value="🔑">🔑 Ключ</option>
              <option value="❓">❓ Вопрос</option>
              <option value="📜">📜 Свиток</option>
              <option value="🎁">🎁 Подарок</option>
            </select>
          </div>
          <div class="fx-field">
            <label>Анимация</label>
            <select id="fxTaskAnimation">
              <option value="float">Покачивание</option>
              <option value="pulse">Пульсация</option>
              <option value="none">Без анимации</option>
            </select>
          </div>
        </div>

        <div id="picker_bonus"></div>
        <div class="fx-card">
          <div class="fx-card-title">Обычные бонусы</div>
          <label class="fx-check">
            <input id="fxBonusesEnabled" type="checkbox">
            Использовать бонусы
          </label>
          <div class="fx-field">
            <label>Количество</label>
            <input id="fxBonusCount" type="number" min="0" max="100">
          </div>
          <div class="fx-field">
            <label>Встроенная иконка</label>
            <select id="fxBonusIcon">
              <option value="🪙">🪙 Монета</option>
              <option value="⭐">⭐ Звезда</option>
              <option value="💎">💎 Кристалл</option>
              <option value="🍎">🍎 Яблоко</option>
            </select>
          </div>
        </div>

        <div id="picker_finish"></div>
      </div>

      <div class="fx-pane" data-pane="settings">
        <div class="fx-card">
          <div class="fx-card-title">Тексты</div>

          <div class="fx-field">
            <label>Текст кнопки старта</label>
            <input id="fxStartText" type="text">
          </div>

          <div class="fx-field">
            <label>Инструкция</label>
            <textarea id="fxInstruction"></textarea>
          </div>

          <div class="fx-field">
            <label>Сообщение «Верно»</label>
            <input id="fxCorrectText" type="text">
          </div>

          <div class="fx-field">
            <label>Сообщение при ошибке</label>
            <input id="fxWrongText" type="text">
          </div>

          <div class="fx-field">
            <label>Финальный заголовок</label>
            <input id="fxFinishTitle" type="text">
          </div>

          <div class="fx-field">
            <label>Финальный текст</label>
            <textarea id="fxFinishText"></textarea>
          </div>
        </div>

        <div class="fx-card">
          <div class="fx-card-title">Игра</div>

          <label class="fx-check">
            <input id="fxShowTaskCounter" type="checkbox">
            Счётчик заданий
          </label>

          <label class="fx-check">
            <input id="fxShowBonusCounter" type="checkbox">
            Счётчик бонусов
          </label>

          <label class="fx-check">
            <input id="fxShowInstruction" type="checkbox">
            Показывать стартовую инструкцию
          </label>

          <label class="fx-check">
            <input id="fxLockFinish" type="checkbox">
            Финиш только после всех заданий
          </label>

          <label class="fx-check">
            <input id="fxShowCorrectAfterAttempts" type="checkbox">
            Показывать правильный ответ после окончания попыток
          </label>

          <div class="fx-grid2">
            <div class="fx-field">
              <label>Попыток</label>
              <select id="fxAttempts">
                <option value="0">Без ограничений</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
              </select>
            </div>

            <div class="fx-field">
              <label>Подсказок</label>
              <select id="fxHintLimit">
                <option value="0">Без ограничений</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="fx-pane" data-pane="preview">
        <div class="fx-card">
          <div class="fx-card-title">Тест-драйв</div>
          <p style="font-size:13px">
            Нажмите кнопку ниже, затем кликните по игре и используйте стрелки клавиатуры.
          </p>
          <button class="fx-btn primary" id="fxPreviewRestart2">▶ Запустить игру заново</button>
        </div>
      </div>

      <div class="fx-pane" data-pane="publish">
        <div class="fx-card">
          <div class="fx-card-title">Публикация</div>
          <div class="fx-actions">
            <button class="fx-btn primary" id="fxCopyBtn">📋 Копировать iframe</button>
            <button class="fx-btn" id="fxShowCodeBtn">Показать код</button>
          </div>
          <div id="fxPublishStatus" class="fx-status"></div>
          <textarea id="fxCode" class="fx-code fx-hidden" readonly></textarea>
        </div>
      </div>

    </div>

    <div class="fx-preview-wrap">
      <div class="fx-preview-toolbar">
        <div>
          <strong>Живой предпросмотр</strong>
          <div class="fx-status">Кликните по игре для управления стрелками</div>
        </div>

        <div class="fx-device-buttons">
          <button class="active" data-device="desktop">🖥</button>
          <button data-device="tablet">📱</button>
          <button data-device="phone">📲</button>
        </div>
      </div>

      <div class="fx-preview-frame desktop" id="fxPreviewFrame">
        <div class="fx-stage" id="fxStage" tabindex="0">
          <div class="fx-bg" id="fxBg"></div>
          <div class="fx-world" id="fxWorld"></div>
          <div class="fx-hud" id="fxHud"></div>

          <div class="fx-overlay" id="fxStartOverlay">
            <div class="fx-modal">
              <img id="fxStartImagePreview" class="fx-question-img fx-hidden">
              <h2 id="fxStartTitle"></h2>
              <p id="fxInstructionPreview"></p>
              <button class="fx-btn primary" id="fxStartBtn"></button>
            </div>
          </div>

          <div class="fx-overlay fx-hidden" id="fxTaskOverlay">
            <div class="fx-modal">
              <h2 id="fxTaskTitlePreview"></h2>
              <img id="fxQuestionImgPreview" class="fx-question-img fx-hidden">
              <p id="fxTaskTextPreview"></p>
              <div id="fxHintPreview" class="fx-hint fx-hidden"></div>
              <button class="fx-btn small fx-hidden" id="fxHintBtn">💡 Подсказка</button>
              <div id="fxAnswersPreview"></div>
              <div id="fxFeedback" class="fx-feedback"></div>
            </div>
          </div>

          <div class="fx-overlay fx-hidden" id="fxFinishOverlay">

              <h2 id="fxFinishTitlePreview"></h2>
              <p id="fxFinishTextPreview"></p>
              <button class="fx-btn primary" id="fxAgainBtn">Играть ещё раз</button>
            </div>
          </div>

          <div id="fxToast" class="fx-toast fx-hidden"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

const root=document.getElementById("FX_ROOT");
if(!root || root.dataset.ready==="1") return;
root.dataset.ready="1";

const $=s=>root.querySelector(s);
const $$=s=>Array.from(root.querySelectorAll(s));

function blankImage(){
  return {mode:"builtin",value:""};
}

const defaults={
  title:"Большое приключение",
  accent:"#6f8063",

  images:{
    background:blankImage(),
    ground:blankImage(),
    platform:blankImage(),
    obstacle:blankImage(),
    player:blankImage(),
    taskItem:blankImage(),
    bonus:blankImage(),
    finish:blankImage(),
    startImage:blankImage()
  },

  colors:{
    sky:"#cfe8f5",
    ground:"#759c62",
    platform:"#b68861",
    obstacle:"#a57555"
  },

  player:{
    size:50,
    speed:230,
    jump:510,
    mirror:true
  },

  taskItem:{
    icon:"⭐",
    size:38,
    animation:"float"
  },

  bonus:{
    enabled:true,
    count:12,
    icon:"🪙"
  },

  texts:{
    start:"Играть",
    instruction:"← → — движение\n↑ — прыжок\n↓ — спуститься с платформы",
    correct:"Верно!",
    wrong:"Попробуй ещё раз",
    finishTitle:"Отличная работа!",
    finishText:"Все задания выполнены!"
  },

  settings:{
    showTaskCounter:true,
    showBonusCounter:true,
    showInstruction:true,
    lockFinish:true,
    attempts:0,
    hintLimit:0,
    showCorrectAfterAttempts:false
  },

  tasks:[
    {
      id:1,
      title:"Задание 1",
      text:"Сколько будет 7 + 5?",
      type:"single",
      hint:"Посчитай от 7 ещё пять.",
      image:blankImage(),
      options:[
        {text:"10",image:blankImage(),correct:false},
        {text:"12",image:blankImage(),correct:true},
        {text:"14",image:blankImage(),correct:false}
      ],
      answer:""
    },
    {
      id:2,
      title:"Задание 2",
      text:"Назови главные члены предложения.",
      type:"manual",
      hint:"",
      image:blankImage(),
      options:[],
      answer:""
    }
  ]
};

let state=JSON.parse(JSON.stringify(defaults));
let nextTaskId=3;

function getImage(obj){
  if(!obj || obj.mode==="builtin" || !obj.value) return "";
  return obj.value;
}

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function readFile(file,cb){
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>cb(String(r.result||""));
  r.readAsDataURL(file);
}

const pickerDefs={
  background:"Фон игры",
  ground:"Земля",
  platform:"Платформы",
  obstacle:"Препятствия",
  player:"Герой",
  taskItem:"Предмет задания",
  bonus:"Коллекционный предмет",
  finish:"Финиш",
  startImage:"Картинка стартового экрана"
};

function renderImagePickers(){
  Object.keys(pickerDefs).forEach(key=>{
    const mount=$("#picker_"+key);
    if(!mount) return;

    const data=state.images[key];

    mount.innerHTML=`
      <div class="fx-card">
        <div class="fx-card-title">${pickerDefs[key]}</div>

        <div class="fx-img-picker" data-picker="${key}">
          <div class="fx-source-tabs">
            <button class="fx-source-btn ${data.mode==="builtin"?"active":""}" data-mode="builtin">Встроенное</button>
            <button class="fx-source-btn ${data.mode==="url"?"active":""}" data-mode="url">URL</button>
            <button class="fx-source-btn ${data.mode==="upload"?"active":""}" data-mode="upload">Файл</button>
          </div>

          <div class="fx-picker-url ${data.mode==="url"?"":"fx-hidden"}">
            <input type="text" data-role="url" value="${data.mode==="url"?esc(data.value):""}" placeholder="https://...">
            <button class="fx-btn small" data-role="apply-url" style="margin-top:6px">Применить</button>
          </div>

          <div class="fx-picker-file ${data.mode==="upload"?"":"fx-hidden"}">
            <input type="file" data-role="file" accept="image/png,image/jpeg,image/webp,image/gif">
          </div>

          <img class="fx-thumb ${getImage(data)?"show":""}" data-role="thumb" src="${esc(getImage(data))}">
        </div>
      </div>
    `;
  });
}

root.addEventListener("click",e=>{
  const picker=e.target.closest("[data-picker]");
  if(picker){
    const key=picker.dataset.picker;

    if(e.target.matches("[data-mode]")){
      state.images[key].mode=e.target.dataset.mode;

      if(state.images[key].mode==="builtin"){
        state.images[key].value="";
      }

      renderImagePickers();
      renderTasks();
      resetGame();
      return;
    }

    if(e.target.matches('[data-role="apply-url"]')){
      const val=picker.querySelector('[data-role="url"]').value.trim();
      state.images[key].mode="url";
      state.images[key].value=val;
      renderImagePickers();
      resetGame();
      return;
    }
  }
});

root.addEventListener("change",e=>{
  const picker=e.target.closest("[data-picker]");

  if(picker && e.target.matches('[data-role="file"]')){
    const key=picker.dataset.picker;

    readFile(e.target.files[0],data=>{
      state.images[key].mode="upload";
      state.images[key].value=data;
      renderImagePickers();
      resetGame();
    });
  }
});

function renderTasks(){
  const box=$("#fxTasksList");
  $("#fxTaskCount").textContent="Добавлено: "+state.tasks.length;

  box.innerHTML="";

  state.tasks.forEach((task,index)=>{
    const card=document.createElement("div");
    card.className="fx-task-card";
    card.dataset.taskId=task.id;

    const isChoice=["single","multi","image"].includes(task.type);

    let options="";

    if(isChoice){
      options=task.options.map((op,oi)=>`
        <div class="fx-option" data-option="${oi}">
          <div class="fx-option-top">
            <input
              type="text"
              data-task-field="optionText"
              data-option-index="${oi}"
              value="${esc(op.text)}"
              placeholder="Текст варианта"
            >

            <label class="fx-check" style="margin:0">
              <input
                type="${task.type==="single"||task.type==="image"?"radio":"checkbox"}"
                name="correct_${task.id}"
                data-task-field="optionCorrect"
                data-option-index="${oi}"
                ${op.correct?"checked":""}
              >
              Верно
            </label>
          </div>

          <div class="fx-option-img">
            <input
              type="text"
              data-task-field="optionImageUrl"
              data-option-index="${oi}"
              value="${op.image && op.image.mode==="url"?esc(op.image.value):""}"
              placeholder="URL картинки ответа"
            >
            <input
              type="file"
              accept="image/*"
              data-task-field="optionImageFile"
              data-option-index="${oi}"
              style="margin-top:5px"
            >
          </div>
        </div>
      `).join("");
    }

    let extra="";

    if(task.type==="input"){
      extra=`
        <div class="fx-field">
          <label>Правильный ответ</label>
          <input type="text" data-task-field="answer" value="${esc(task.answer)}">
        </div>
      `;
    }

    if(task.type==="truefalse"){
      extra=`
        <div class="fx-field">
          <label>Правильный ответ</label>
          <select data-task-field="answer">
            <option value="true" ${task.answer==="true"?"selected":""}>Верно</option>
            <option value="false" ${task.answer==="false"?"selected":""}>Неверно</option>
          </select>
        </div>
      `;
    }

    card.innerHTML=`
      <div class="fx-task-head">
        <div class="fx-task-num">Задание ${index+1}</div>
        <div class="fx-task-actions">
          <button class="fx-btn small" data-act="up">↑</button>
          <button class="fx-btn small" data-act="down">↓</button>
          <button class="fx-btn danger small" data-act="delete">×</button>
        </div>
      </div>

      <div class="fx-field">
        <label>Заголовок</label>
        <input type="text" data-task-field="title" value="${esc(task.title)}">
      </div>

      <div class="fx-field">
        <label>Текст задания</label>
        <textarea data-task-field="text">${esc(task.text)}</textarea>
      </div>

      <div class="fx-field">
        <label>Тип задания</label>
        <select data-task-field="type">
          <option value="single" ${task.type==="single"?"selected":""}>Один правильный ответ</option>
          <option value="multi" ${task.type==="multi"?"selected":""}>Несколько правильных</option>
          <option value="truefalse" ${task.type==="truefalse"?"selected":""}>Верно / неверно</option>
          <option value="input" ${task.type==="input"?"selected":""}>Ввод ответа</option>
          <option value="manual" ${task.type==="manual"?"selected":""}>Устный ответ</option>
          <option value="image" ${task.type==="image"?"selected":""}>Выбор картинки</option>
        </select>
      </div>

      <div class="fx-field">
        <label>Подсказка</label>
        <input type="text" data-task-field="hint" value="${esc(task.hint)}">
      </div>

      <div class="fx-field">
        <label>Картинка к вопросу — URL</label>
        <input
          type="text"
          data-task-field="questionImageUrl"
          value="${task.image && task.image.mode==="url"?esc(task.image.value):""}"
          placeholder="https://..."
        >
      </div>

      <div class="fx-field">
        <label>Или загрузить картинку</label>
        <input type="file" accept="image/*" data-task-field="questionImageFile">
      </div>

      ${options}
      ${extra}

      ${isChoice?`
        <button class="fx-btn small" data-act="add-option">+ Вариант ответа</button>
      `:""}
    `;

    box.appendChild(card);
  });
}

function newTask(){
  return {
    id:nextTaskId++,
    title:"Новое задание",
    text:"Введите текст задания",
    type:"single",
    hint:"",
    image:blankImage(),
    options:[
      {text:"Ответ 1",image:blankImage(),correct:true},
      {text:"Ответ 2",image:blankImage(),correct:false}
    ],
    answer:""
  };
}

$("#fxAddTask").addEventListener("click",()=>{
  state.tasks.push(newTask());
  renderTasks();
  resetGame();
});

$("#fxTasksList").addEventListener("click",e=>{
  const card=e.target.closest(".fx-task-card");
  if(!card) return;

  const id=Number(card.dataset.taskId);
  const index=state.tasks.findIndex(t=>t.id===id);
  if(index<0) return;

  const act=e.target.dataset.act;

  if(act==="delete"){
    state.tasks.splice(index,1);
    renderTasks();
    resetGame();
  }

  if(act==="up" && index>0){
    [state.tasks[index-1],state.tasks[index]]=[state.tasks[index],state.tasks[index-1]];
    renderTasks();
    resetGame();
  }

  if(act==="down" && index<state.tasks.length-1){
    [state.tasks[index+1],state.tasks[index]]=[state.tasks[index],state.tasks[index+1]];
    renderTasks();
    resetGame();
  }

  if(act==="add-option"){
    state.tasks[index].options.push({
      text:"Новый вариант",
      image:blankImage(),
      correct:false
    });
    renderTasks();
  }
});

$("#fxTasksList").addEventListener("input",e=>{
  const card=e.target.closest(".fx-task-card");
  if(!card) return;

  const task=state.tasks.find(t=>t.id===Number(card.dataset.taskId));
  if(!task) return;

  const f=e.target.dataset.taskField;
  if(!f) return;

  if(f==="title") task.title=e.target.value;
  if(f==="text") task.text=e.target.value;
  if(f==="hint") task.hint=e.target.value;
  if(f==="answer") task.answer=e.target.value;

  if(f==="type"){
    task.type=e.target.value;

    if(["single","multi","image"].includes(task.type) && !task.options.length){
      task.options=[
        {text:"Ответ 1",image:blankImage(),correct:true},
        {text:"Ответ 2",image:blankImage(),correct:false}
      ];
    }

    if(task.type==="truefalse" && !task.answer){
      task.answer="true";
    }

    renderTasks();
    resetGame();
    return;
  }

  if(f==="questionImageUrl"){
    task.image={mode:"url",value:e.target.value.trim()};
  }

  if(f==="optionText"){
    const oi=Number(e.target.dataset.optionIndex);
    task.options[oi].text=e.target.value;
  }

  if(f==="optionImageUrl"){
    const oi=Number(e.target.dataset.optionIndex);
    task.options[oi].image={mode:"url",value:e.target.value.trim()};
  }
});

$("#fxTasksList").addEventListener("change",e=>{
  const card=e.target.closest(".fx-task-card");
  if(!card) return;

  const task=state.tasks.find(t=>t.id===Number(card.dataset.taskId));
  if(!task) return;

  const f=e.target.dataset.taskField;

  if(f==="optionCorrect"){
    const oi=Number(e.target.dataset.optionIndex);

    if(task.type==="single" || task.type==="image"){
      task.options.forEach((o,i)=>o.correct=i===oi);
      renderTasks();
    }else{
      task.options[oi].correct=e.target.checked;
    }
  }

  if(f==="questionImageFile"){
    readFile(e.target.files[0],data=>{
      task.image={mode:"upload",value:data};
    });
  }

  if(f==="optionImageFile"){
    const oi=Number(e.target.dataset.optionIndex);

    readFile(e.target.files[0],data=>{
      task.options[oi].image={mode:"upload",value:data};
    });
  }

  if(f==="answer"){
    task.answer=e.target.value;
  }
});

function bindSimple(){
  const bindings=[
    ["#fxTitle",v=>state.title=v],
    ["#fxAccent",v=>state.accent=v],
    ["#fxSky",v=>state.colors.sky=v],
    ["#fxPlayerSize",v=>state.player.size=+v],
    ["#fxPlayerSpeed",v=>state.player.speed=+v],
    ["#fxJump",v=>state.player.jump=+v],
    ["#fxTaskSize",v=>state.taskItem.size=+v],
    ["#fxTaskIcon",v=>state.taskItem.icon=v],
    ["#fxTaskAnimation",v=>state.taskItem.animation=v],
    ["#fxBonusCount",v=>state.bonus.count=+v],
    ["#fxBonusIcon",v=>state.bonus.icon=v],
    ["#fxStartText",v=>state.texts.start=v],
    ["#fxInstruction",v=>state.texts.instruction=v],
    ["#fxCorrectText",v=>state.texts.correct=v],
    ["#fxWrongText",v=>state.texts.wrong=v],
    ["#fxFinishTitle",v=>state.texts.finishTitle=v],
    ["#fxFinishText",v=>state.texts.finishText=v],
    ["#fxAttempts",v=>state.settings.attempts=+v],
    ["#fxHintLimit",v=>state.settings.hintLimit=+v]
  ];

  bindings.forEach(([sel,setter])=>{
    const el=$(sel);
    el.addEventListener("input",()=>{
      setter(el.value);
      resetGame();
    });
    el.addEventListener("change",()=>{
      setter(el.value);
      resetGame();
    });
  });

  const checks=[
    ["#fxMirror",(v)=>state.player.mirror=v],
    ["#fxBonusesEnabled",(v)=>state.bonus.enabled=v],
    ["#fxShowTaskCounter",(v)=>state.settings.showTaskCounter=v],
    ["#fxShowBonusCounter",(v)=>state.settings.showBonusCounter=v],
    ["#fxShowInstruction",(v)=>state.settings.showInstruction=v],
    ["#fxLockFinish",(v)=>state.settings.lockFinish=v],
    ["#fxShowCorrectAfterAttempts",(v)=>state.settings.showCorrectAfterAttempts=v]
  ];

  checks.forEach(([sel,setter])=>{
    const el=$(sel);
    el.addEventListener("change",()=>{
      setter(el.checked);
      resetGame();
    });
  });
}

function syncInputs(){
  $("#fxTitle").value=state.title;
  $("#fxAccent").value=state.accent;
  $("#fxSky").value=state.colors.sky;

  $("#fxPlayerSize").value=state.player.size;

$("#fxTabs").addEventListener("click",e=>{
  const tab=e.target.closest(".fx-tab");
  if(!tab) return;

  $$(".fx-tab").forEach(x=>x.classList.remove("active"));
  $$(".fx-pane").forEach(x=>x.classList.remove("active"));

  $('[data-pane="'+tab.dataset.tab+'"]').classList.add("active");
});

$$(".fx-device-buttons button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    $$(".fx-device-buttons button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    $("#fxPreviewFrame").className=
      "fx-preview-frame "+btn.dataset.device;
  });
});

function makeMap(taskCount){
  const perSection=5;
  const sections=Math.max(1,Math.ceil(Math.max(1,taskCount)/perSection));
  const W=760;

  const ground=[];
  const platforms=[];
  const obstacles=[];
  const tasks=[];
  const bonuses=[];

  for(let s=0;s<sections;s++){
    const x=s*W;

    ground.push({x:x,y:0,w:245,h:34});
    ground.push({x:x+330,y:0,w:430,h:34});

    platforms.push({x:x+110,y:100,w:125,h:20});
    platforms.push({x:x+275,y:165,w:130,h:20});
    platforms.push({x:x+455,y:225,w:140,h:20});
    platforms.push({x:x+570,y:115,w:125,h:20});

    obstacles.push({x:x+55,y:34,w:48,h:50});
    obstacles.push({x:x+655,y:34,w:48,h:70});

    tasks.push(
      {x:x+145,y:140},
      {x:x+310,y:205},
      {x:x+500,y:265},
      {x:x+610,y:155},
      {x:x+390,y:55}
    );

    bonuses.push(
      {x:x+20,y:58},
      {x:x+205,y:140},
      {x:x+352,y:55},
      {x:x+438,y:55},
      {x:x+535,y:265},
      {x:x+710,y:58}
    );
  }

  const end=sections*W;

  ground.push({x:end,y:0,w:330,h:34});
  platforms.push({x:end+75,y:110,w:130,h:20});

  return {
    width:end+380,
    ground,
    platforms,
    obstacles,
    tasks:tasks.slice(0,taskCount),
    bonuses,
    finishX:end+255
  };
}

let game=null;

function resetGame(){
  cancelAnimationFrame(game && game.raf || 0);

  root.style.setProperty("--accent",state.accent);

  game={
    started:false,
    paused:false,
    done:false,
    x:70,
    y:34,
    vx:0,
    vy:0,
    grounded:false,
    camera:0,
    last:performance.now(),
    safeX:70,
    completed:new Set(),
    collected:new Set(),
    attempts:{},
    hintsUsed:0,
    activeTask:-1,
    selectedAnswers:new Set(),
    keys:{left:false,right:false,up:false,down:false},
    map:makeMap(state.tasks.length),
    raf:0
  };

  renderWorld();
  renderHud();

  $("#fxStartTitle").textContent=state.title;
  $("#fxInstructionPreview").textContent=
    state.settings.showInstruction ? state.texts.instruction : "";

  $("#fxStartBtn").textContent=state.texts.start;

  const startImg=getImage(state.images.startImage);
  const si=$("#fxStartImagePreview");

  if(startImg){
    si.src=startImg;
    si.classList.remove("fx-hidden");
  }else{
    si.removeAttribute("src");
    si.classList.add("fx-hidden");
  }

  $("#fxStartOverlay").classList.remove("fx-hidden");
  $("#fxTaskOverlay").classList.add("fx-hidden");
  $("#fxFinishOverlay").classList.add("fx-hidden");

  startLoop();
}

function cssImage(obj){
  const v=getImage(obj);
  return v ? 'url("'+v+'")' : "none";
}

function createObj(cls,r){
  const e=document.createElement("div");
  e.className="fx-obj "+cls;
  e.style.left=r.x+"px";
  e.style.bottom=r.y+"px";
  e.style.width=r.w+"px";
  e.style.height=r.h+"px";
  $("#fxWorld").appendChild(e);
  return e;
}

function renderWorld(){
  const world=$("#fxWorld");
  world.innerHTML="";
  world.style.width=game.map.width+"px";

  const bg=$("#fxBg");
  bg.style.backgroundColor=state.colors.sky;
  bg.style.backgroundImage=cssImage(state.images.background);

  game.map.ground.forEach(r=>{
    const e=createObj("fx-ground",r);
    e.style.backgroundColor=state.colors.ground;

    const img=getImage(state.images.ground);
    if(img){
      e.style.backgroundImage='url("'+img+'")';
      e.style.backgroundSize="cover";
    }
  });

  game.map.platforms.forEach(r=>{
    const e=createObj("fx-platform",r);
    e.style.backgroundColor=state.colors.platform;

    const img=getImage(state.images.platform);

          x:p.x,y:p.y,w:26,h:26

function renderHud(){

  hud.innerHTML="";

    hud.appendChild(p);

function overlap(a,b){
  return a.x<b.x+b.w &&
         a.x+a.w>b.x &&
         a.y<b.y+b.h &&
         a.y+a.h>b.y;
}

function jump(){
  if(game.started && !game.paused && game.grounded){
    game.vy=state.player.jump;
    game.grounded=false;
  }
}

function update(dt){
  const pw=state.player.size*.75;
  const ph=state.player.size;

  let dir=0;
  if(game.keys.left) dir--;
  if(game.keys.right) dir++;

  game.vx=dir*state.player.speed;

  let nx=game.x+game.vx*dt;

  const test={x:nx,y:game.y,w:pw,h:ph};

  for(const o of game.map.obstacles){
    if(overlap(test,o)){
      if(game.vx>0) nx=o.x-pw-.1;
      if(game.vx<0) nx=o.x+o.w+.1;
      break;
    }
  }

  game.x=clamp(nx,0,game.map.width-pw);

  game.vy-=1150*dt;

  let ny=game.y+game.vy*dt;
  let landed=false;

  const surfaces=[...game.map.ground,...game.map.platforms];

  if(game.vy<=0){
    for(const s of surfaces){
      const top=s.y+s.h;

      const horizontal=
        game.x+pw>s.x &&
        game.x<s.x+s.w;

      if(horizontal && game.y>=top-3 && ny<=top){
        ny=top;
        game.vy=0;
        landed=true;
        break;
      }
    }
  }

  game.y=ny;
  game.grounded=landed;

  if(landed) game.safeX=game.x;

  if(game.y<-130){
    game.x=game.safeX;
    game.y=170;
    game.vy=0;
  }

  checkTasks(pw,ph);
  checkBonuses(pw,ph);
  checkFinish(pw,ph);
}

function draw(){
  const player=$("#fxPlayerObject");
  if(!player) return;

  const vw=$("#fxStage").clientWidth;

  game.camera=clamp(
    game.x-vw*.35,
    0,
    Math.max(0,game.map.width-vw)
  );

  $("#fxWorld").style.transform=
    "translateX("+(-game.camera)+"px)";

  player.style.left=game.x+"px";
  player.style.bottom=game.y+"px";

  if(state.player.mirror){
    if(game.vx<0) player.style.transform="scaleX(-1)";
    if(game.vx>0) player.style.transform="scaleX(1)";
  }
}

function checkTasks(pw,ph){
  const pr={x:game.x,y:game.y,w:pw,h:ph};

  game.map.tasks.forEach((p,i)=>{
    if(game.completed.has(i)) return;

    const s=state.taskItem.size;

    if(overlap(pr,{x:p.x,y:p.y,w:s,h:s})){
      openTask(i);
    }
  });
}

function checkBonuses(pw,ph){
  if(!state.bonus.enabled) return;

  const pr={x:game.x,y:game.y,w:pw,h:ph};

  game.map.bonuses
    .slice(0,Math.min(state.bonus.count,game.map.bonuses.length))
    .forEach((p,i)=>{
      if(game.collected.has(i)) return;

      if(overlap(pr,{x:p.x,y:p.y,w:26,h:26})){
        game.collected.add(i);

        const el=$("#fxWorld").querySelector('[data-bonus="'+i+'"]');
        if(el) el.remove();

        renderHud();
      }
    });
}

function checkFinish(pw,ph){
  const pr={x:game.x,y:game.y,w:pw,h:ph};

  if(!overlap(pr,{
    x:game.map.finishX,
    y:34,
    w:54,
    h:88
  })) return;

  if(
    state.settings.lockFinish &&
    game.completed.size<state.tasks.length
  ){
    toast("Выполни все задания: "+game.completed.size+"/"+state.tasks.length);
    return;
  }

  finishGame();
}

let toastTimer=0;

function toast(text){
  clearTimeout(toastTimer);

  const el=$("#fxToast");
  el.textContent=text;
  el.classList.remove("fx-hidden");

  toastTimer=setTimeout(()=>{
    el.classList.add("fx-hidden");
  },1400);
}

function openTask(i){
  if(game.paused) return;

  const task=state.tasks[i];
  if(!task) return;

  game.paused=true;
  game.activeTask=i;
  game.selectedAnswers.clear();
  game.attempts[i]=game.attempts[i]||0;

  $("#fxTaskTitlePreview").textContent=
    task.title || "Задание "+(i+1);

  $("#fxTaskTextPreview").textContent=task.text||"";
  $("#fxFeedback").textContent="";

  const qimg=getImage(task.image);
  const img=$("#fxQuestionImgPreview");

  if(qimg){
    img.src=qimg;
    img.classList.remove("fx-hidden");
  }else{
    img.classList.add("fx-hidden");
  }

  const hintBtn=$("#fxHintBtn");
  $("#fxHintPreview").classList.add("fx-hidden");

  if(task.hint){
    hintBtn.classList.remove("fx-hidden");
  }else{
    hintBtn.classList.add("fx-hidden");
  }

  hintBtn.onclick=()=>{
    if(
      state.settings.hintLimit>0 &&
      game.hintsUsed>=state.settings.hintLimit
    ){
      toast("Подсказки закончились");
      return;
    }

    game.hintsUsed++;
    $("#fxHintPreview").textContent=task.hint;
    $("#fxHintPreview").classList.remove("fx-hidden");
  };

  renderAnswers(task,i);

  $("#fxTaskOverlay").classList.remove("fx-hidden");
}

function renderAnswers(task,index){
  const box=$("#fxAnswersPreview");
  box.innerHTML="";

  if(task.type==="manual"){
    const b=document.createElement("button");
    b.className="fx-btn primary";
    b.textContent="Готово";
    b.onclick=()=>completeTask(index);
    box.appendChild(b);
    return;
  }

  if(task.type==="truefalse"){
    ["Верно","Неверно"].forEach((label,ii)=>{
      const b=document.createElement("button");
      b.className="fx-answer-btn";
      b.textContent=label;

      b.onclick=()=>{
        const val=ii===0?"true":"false";
        checkSimple(val===task.answer,index,task);
      };

      box.appendChild(b);
    });

    return;
  }

  if(task.type==="input"){
    const inp=document.createElement("input");
    inp.className="fx-text-answer";
    inp.type="text";
    inp.placeholder="Введите ответ";

    const b=document.createElement("button");
    b.className="fx-btn primary";
    b.textContent="Проверить";

    b.onclick=()=>{
      const a=String(inp.value).trim().toLowerCase();
      const c=String(task.answer).trim().toLowerCase();
      checkSimple(a===c,index,task);
    };

    box.appendChild(inp);
    box.appendChild(b);
    return;
  }

  task.options.forEach((op,oi)=>{
    const b=document.createElement("button");
    b.className="fx-answer-btn";

    const img=getImage(op.image);

    if(img){
      const im=document.createElement("img");
      im.src=img;
      b.appendChild(im);
    }

    if(op.text){
      const sp=document.createElement("span");
      sp.textContent=op.text;
      b.appendChild(sp);
    }

    if(task.type==="multi"){
      b.onclick=()=>{
        if(game.selectedAnswers.has(oi)){
          game.selectedAnswers.delete(oi);
          b.classList.remove("selected");
        }else{
          game.selectedAnswers.add(oi);
          b.classList.add("selected");
        }
      };
    }else{
      b.onclick=()=>{
        checkSimple(!!op.correct,index,task);
      };
    }

    box.appendChild(b);
  });

  if(task.type==="multi"){
    const check=document.createElement("button");
    check.className="fx-btn primary";
    check.textContent="Проверить";

    check.onclick=()=>{
      const correct=task.options
        .map((o,i)=>o.correct?i:-1)
        .filter(i=>i>=0);

      const selected=Array.from(game.selectedAnswers).sort((a,b)=>a-b);

      const ok=
        selected.length===correct.length &&
        selected.every((v,i)=>v===correct[i]);

      checkSimple(ok,index,task);
    };

    box.appendChild(check);
  }
}

function checkSimple(ok,index,task){
  if(ok){
    $("#fxFeedback").textContent=state.texts.correct;

    setTimeout(()=>{
      completeTask(index);
    },350);

    return;
  }

  game.attempts[index]=(game.attempts[index]||0)+1;

  $("#fxFeedback").textContent=state.texts.wrong;

  const lim=state.settings.attempts;

  if(lim>0 && game.attempts[index]>=lim){
    if(state.settings.showCorrectAfterAttempts){
      const correct=getCorrectText(task);

      if(correct){
        $("#fxFeedback").textContent=
          state.texts.wrong+" Правильный ответ: "+correct;
      }
    }
  }
}

function getCorrectText(task){
  if(task.type==="truefalse"){
    return task.answer==="true"?"Верно":"Неверно";
  }

  if(task.type==="input"){
    return task.answer;
  }

  return task.options
    .filter(o=>o.correct)
    .map(o=>o.text||"картинка")
    .join(", ");
}

function completeTask(i){
  game.completed.add(i);

  const el=$("#fxWorld").querySelector('[data-task="'+i+'"]');
  if(el) el.remove();

  $("#fxTaskOverlay").classList.add("fx-hidden");

  game.activeTask=-1;
  game.paused=false;

  renderHud();
  $("#fxStage").focus();
}

function finishGame(){
  if(game.done) return;

  game.done=true;
  game.paused=true;

  $("#fxFinishTitlePreview").textContent=state.texts.finishTitle;

  $("#fxFinishTextPreview").textContent=
    state.texts.finishText+
    "\n\nЗадания: "+
    game.completed.size+
    "/"+
    state.tasks.length;

  $("#fxFinishOverlay").classList.remove("fx-hidden");
}

function startLoop(){
  function frame(now){
    const dt=Math.min((now-game.last)/1000,.032);
    game.last=now;

    if(game.started && !game.paused && !game.done){
      update(dt);
    }

    draw();
    game.raf=requestAnimationFrame(frame);
  }

  game.raf=requestAnimationFrame(frame);
}

$("#fxStage").addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)){
    e.preventDefault();
  }

  if(e.key==="ArrowLeft") game.keys.left=true;
  if(e.key==="ArrowRight") game.keys.right=true;

  if(e.key==="ArrowUp"){
    if(!game.keys.up) jump();
    game.keys.up=true;
  }

  if(e.key==="ArrowDown"){
    game.keys.down=true;

    if(game.grounded){
      game.y-=10;
      game.vy=-100;
    }
  }
});

$("#fxStage").addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft") game.keys.left=false;
  if(e.key==="ArrowRight") game.keys.right=false;
  if(e.key==="ArrowUp") game.keys.up=false;
  if(e.key==="ArrowDown") game.keys.down=false;
});

function safeJSON(obj){
  return JSON.stringify(obj)
    .replace(/</g,"\\u003c")
    .replace(/>/g,"\\u003e")
    .replace(/&/g,"\\u0026");
}

 renderHud();
}
function renderHud(){hud.innerHTML="";if(state.settings.showTaskCounter){const p=document.createElement("div");p.className="pill";p.textContent=state.taskItem.icon+" "+G.completed.size+"/"+state.tasks.length;hud.appendChild(p)}if(state.settings.showBonusCounter&&state.bonus.enabled){const p=document.createElement("div");p.className="pill";p.textContent=state.bonus.icon+" "+G.collected.size;hud.appendChild(p)}}
function complete(i){G.completed.add(i);const e=world.querySelector('[data-task="'+i+'"]');if(e)e.remove();document.getElementById("taskOverlay").classList.add("hidden");G.paused=false;renderHud();game.focus()}
function openTask(i){
 if(G.paused)return;const t=state.tasks[i];if(!t)return;G.paused=true;G.active=i;G.selected.clear();
 document.getElementById("taskTitle").textContent=t.title||"Задание";document.getElementById("taskText").textContent=t.text||"";document.getElementById("feedback").textContent="";
 const qi=img(t.image),qe=document.getElementById("qimg");if(qi){qe.src=qi;qe.classList.remove("hidden")}else qe.classList.add("hidden");
 const hb=document.getElementById("hintBtn"),hh=document.getElementById("hint");hh.classList.add("hidden");if(t.hint){hb.classList.remove("hidden");hb.onclick=()=>{hh.textContent=t.hint;hh.classList.remove("hidden")}}else hb.classList.add("hidden");
 const a=document.getElementById("answers");a.innerHTML="";
 if(t.type==="manual"){const b=document.createElement("button");b.className="primary";b.textContent="Готово";b.onclick=()=>complete(i);a.appendChild(b)}
 else if(t.type==="truefalse"){["Верно","Неверно"].forEach((x,k)=>{const b=document.createElement("button");b.className="answer";b.textContent=x;b.onclick=()=>check((k===0?"true":"false")===t.answer,i);a.appendChild(b)})}
 else if(t.type==="input"){const inp=document.createElement("input");inp.placeholder="Введите ответ";const b=document.createElement("button");b.className="primary";b.textContent="Проверить";b.onclick=()=>check(String(inp.value).trim().toLowerCase()===String(t.answer).trim().toLowerCase(),i);a.append(inp,b)}
 else{t.options.forEach((op,oi)=>{const b=document.createElement("button");b.className="answer";const im=img(op.image);if(im){const z=document.createElement("img");z.src=im;b.appendChild(z)}if(op.text){const s=document.createElement("span");s.textContent=op.text;b.appendChild(s)}if(t.type==="multi"){b.onclick=()=>{if(G.selected.has(oi)){G.selected.delete(oi);b.classList.remove("selected")}else{G.selected.add(oi);b.classList.add("selected")}}}else b.onclick=()=>check(!!op.correct,i);a.appendChild(b)});if(t.type==="multi"){const b=document.createElement("button");b.className="primary";b.textContent="Проверить";b.onclick=()=>{const c=t.options.map((o,i)=>o.correct?i:-1).filter(i=>i>=0),s=[...G.selected].sort((a,b)=>a-b);check(s.length===c.length&&s.every((v,i)=>v===c[i]),i)};a.appendChild(b)}}
 document.getElementById("taskOverlay").classList.remove("hidden");
}
function check(ok,i){document.getElementById("feedback").textContent=ok?state.texts.correct:state.texts.wrong;if(ok)setTimeout(()=>complete(i),300)}
function update(dt){
 const pw=state.player.size*.75,ph=state.player.size;let d=0;if(G.keys.left)d--;if(G.keys.right)d++;G.vx=d*state.player.speed;
 let nx=G.x+G.vx*dt,test={x:nx,y:G.y,w:pw,h:ph};for(const o of M.obstacles){if(overlap(test,o)){if(G.vx>0)nx=o.x-pw-.1;if(G.vx<0)nx=o.x+o.w+.1;break}}G.x=clamp(nx,0,M.width-pw);
 G.vy-=1150*dt;let ny=G.y+G.vy*dt,land=false;for(const s of [...M.ground,...M.platforms]){const top=s.y+s.h;if(G.vy<=0&&G.x+pw>s.x&&G.x<s.x+s.w&&G.y>=top-3&&ny<=top){ny=top;G.vy=0;land=true;break}}G.y=ny;G.grounded=land;if(land)G.safeX=G.x;if(G.y<-130){G.x=G.safeX;G.y=170;G.vy=0}
 const pr={x:G.x,y:G.y,w:pw,h:ph};M.tasks.forEach((q,i)=>{if(!G.completed.has(i)&&overlap(pr,{x:q.x,y:q.y,w:state.taskItem.size,h:state.taskItem.size}))openTask(i)});
 if(state.bonus.enabled)M.bonuses.slice(0,Math.min(state.bonus.count,M.bonuses.length)).forEach((q,i)=>{if(!G.collected.has(i)&&overlap(pr,{x:q.x,y:q.y,w:26,h:26})){G.collected.add(i);const e=world.querySelector('[data-bonus="'+i+'"]');if(e)e.remove();renderHud()}});
 if(overlap(pr,{x:M.finishX,y:34,w:54,h:88})){if(!state.settings.lockFinish||G.completed.size>=state.tasks.length){G.done=true;G.paused=true;document.getElementById("finishTitle").textContent=state.texts.finishTitle;document.getElementById("finishText").textContent=state.texts.finishText+"\\n\\nЗадания: "+G.completed.size+"/"+state.tasks.length;document.getElementById("finishOverlay").classList.remove("hidden")}}
}
function draw(){const p=document.getElementById("player");if(!p)return;const vw=game.clientWidth;G.camera=clamp(G.x-vw*.35,0,Math.max(0,M.width-vw));world.style.transform="translateX("+(-G.camera)+"px)";p.style.left=G.x+"px";p.style.bottom=G.y+"px";if(state.player.mirror){if(G.vx<0)p.style.transform="scaleX(-1)";if(G.vx>0)p.style.transform="scaleX(1)"}}
function loop(now){const dt=Math.min((now-G.last)/1000,.032);G.last=now;if(G.started&&!G.paused&&!G.done)update(dt);draw();requestAnimationFrame(loop)}
game.addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key))e.preventDefault();if(e.key==="ArrowLeft")G.keys.left=true;if(e.key==="ArrowRight")G.keys.right=true;if(e.key==="ArrowUp"){if(!G.keys.up&&G.grounded){G.vy=state.player.jump;G.grounded=false}G.keys.up=true}});
game.addEventListener("keyup",e=>{if(e.key==="ArrowLeft")G.keys.left=false;if(e.key==="ArrowRight")G.keys.right=false;if(e.key==="ArrowUp")G.keys.up=false});
game.addEventListener("pointerdown",()=>game.focus());
document.getElementById("startTitle").textContent=state.title;document.getElementById("instruction").textContent=state.settings.showInstruction?state.texts.instruction:"";document.getElementById("startBtn").textContent=state.texts.start;
const si=img(state.images.startImage),se=document.getElementById("startImg");if(si){se.src=si;se.classList.remove("hidden")}
document.getElementById("startBtn").onclick=()=>{G.started=true;document.getElementById("start").classList.add("hidden");game.focus()};
document.getElementById("again").onclick=()=>location.reload();
build();requestAnimationFrame(loop);
<\/script></body></html>`;
}

function generateIframe(){
  const html=generateStandaloneGame();

  return '<iframe src="data:text/html;charset=utf-8,'+
    encodeURIComponent(html)+
    '" width="100%" height="600" style="border:0;width:100%;display:block;" allow="fullscreen"></iframe>';
}

async function copyCode(){
  const code=generateIframe();

  $("#fxCode").value=code;

  try{
    await navigator.clipboard.writeText(code);
    $("#fxPublishStatus").textContent="✓ Код скопирован";
  }catch(err){
    $("#fxCode").classList.remove("fx-hidden");
    $("#fxCode").select();
    $("#fxPublishStatus").textContent="Скопируйте код из поля вручную";
  }
}

$("#fxCopyBtn").addEventListener("click",copyCode);
$("#fxQuickCopyBtn").addEventListener("click",copyCode);

$("#fxShowCodeBtn").addEventListener("click",()=>{
  $("#fxCode").value=generateIframe();
  $("#fxCode").classList.toggle("fx-hidden");
});

syncInputs();
bindSimple();
renderImagePickers();
renderTasks();
resetGame();

})();
</script>
</div>
